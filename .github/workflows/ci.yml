name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-vet:
    name: Go format and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make fmt-check vet

  go:
    # make test-go, split across parallel jobs (see test-go-shard in the Makefile).
    name: Go tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [api, domain, rest, parity]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make test-go-shard GO_SHARD=${{ matrix.shard }}
      - name: Real ffprobe suite (ubuntu-latest ships ffmpeg)
        if: matrix.shard == 'rest'
        run: make test-ffprobe

  generated:
    name: OpenAPI drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - name: Regenerate and fail on drift
        run: make generate-check

  web:
    name: SPA tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: make test-web
      - run: make web-build

  compose:
    name: Reference compose.yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: make compose-check

  image:
    name: Image builds and answers /ping
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t kestrel:ci .
      - name: Start with one /data mount and wait for the healthcheck
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          docker run -d --name kestrel -p 7676:7676 -v "$RUNNER_TEMP/data:/data" kestrel:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:7676/ping && exit 0
            sleep 1
          done
          docker logs kestrel
          exit 1

  release-dry-run:
    # The image job builds the image, so this one only checks the release assets.
    name: Release dry run (plugin binaries, silo-repository.json, checksums)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.3 # GORELEASER in the Makefile
          install-only: true
      - run: make dry-run-assets GORELEASER_CMD=goreleaser

  commitlint:
    name: Conventional Commit PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Lint the PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx --no-install commitlint

  commitlint-main:
    name: Conventional Commit messages on main
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx --no-install commitlint --from "${{ github.event.before }}" --to "${{ github.sha }}"
