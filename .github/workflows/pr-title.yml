name: PR title

# Its own workflow so that renaming a PR (edited) rechecks the title without rerunning CI.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Squash merges take the PR title as the commit header on main, so this is the check that
# guards the headers the changelog is read from.
jobs:
  title:
    name: Conventional Commit PR title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | make commit-check
