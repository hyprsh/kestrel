name: Release

# release-please keeps a release PR open on main. Merging it creates the vX.Y.Z tag
# and GitHub release; the publish job then attaches the Silo plugin binaries,
# checksums, silo-repository.json and the notices (GoReleaser) and pushes the
# multi-arch image, with build-provenance attestations for all of them.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Silo plugin binaries, checksums, silo-repository.json and notices
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest the release assets
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/kestrel-silo_*/kestrel-silo
            dist/checksums.txt
            release-assets/silo-repository.json
            internal/notices/THIRD_PARTY_NOTICES.md

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # While versions are 0.x, docker/metadata-action would skip the major tag, so the tags are spelled out.
      - name: Image tags X.Y.Z, X.Y, X and latest
        id: tags
        run: |
          IFS=. read -r major minor _ <<< "$VERSION"
          {
            echo "list<<EOF"
            echo "ghcr.io/hyprsh/kestrel:$VERSION"
            echo "ghcr.io/hyprsh/kestrel:$major.$minor"
            echo "ghcr.io/hyprsh/kestrel:$major"
            echo "ghcr.io/hyprsh/kestrel:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push the multi-arch image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            VERSION=${{ env.VERSION }}
            TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
            TVDB_API_KEY=${{ secrets.TVDB_API_KEY }}
          labels: |
            org.opencontainers.image.source=https://github.com/hyprsh/kestrel
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=GPL-3.0-only

      - name: Attest the image
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/hyprsh/kestrel
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
