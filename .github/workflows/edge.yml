name: Edge image

# Every push to main publishes ghcr.io/hyprsh/kestrel:edge. Edge builds report
# their version as "edge" and skip the update comparison.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: edge
  cancel-in-progress: true

jobs:
  edge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the multi-arch image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/hyprsh/kestrel:edge
          build-args: |
            VERSION=edge
            TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
          labels: |
            org.opencontainers.image.source=https://github.com/hyprsh/kestrel
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=GPL-3.0-only
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/hyprsh/kestrel
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
