<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The Go server rewrites this to KESTREL_BASE_URL. Keep the exact text. -->
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kestrel</title>
    <script>
      // Apply the stored theme before first paint, to avoid a light flash in dark mode.
      try {
        var t = localStorage.getItem('kestrel.theme')
        if (t === 'dark' || ((!t || t === 'system') && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
