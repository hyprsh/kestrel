openapi: 3.0.3
info:
  title: Kestrel API
  version: "1"
  description: |
    The Kestrel REST API, shared by the web UI, the Silo router plugin and outside scripts.
    This file is the source of truth: Go handlers and the TypeScript client are generated from it.

    Compatibility within `v1` is additive only: new fields, endpoints and enum values.
    Clients must ignore unknown fields and tolerate unknown enum values.
    A breaking change means `/api/v2` and a Kestrel major release.

    Conventions: `snake_case` fields, integer ids, RFC 3339 UTC times, lowercase string enums,
    every field always present (`null` for "none"), errors as RFC 9457 `application/problem+json`
    with a stable `code`.
servers:
  - url: /api/v1
    description: Relative to the instance's KESTREL_BASE_URL, if any.
paths:
  /system:
    get:
      operationId: getSystem
      summary: Version and API major of this instance
      description: |
        The Silo plugin's `TestConnection` reads `api_major`.
        Unauthenticated until an account exists.
      tags: [system]
      responses:
        "200":
          description: The running instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/System"
        default:
          $ref: "#/components/responses/Problem"
  /setup:
    get:
      operationId: getSetup
      summary: Setup progress
      description: |
        Answers before an account exists (one of the few endpoints that do), and afterwards to
        a logged-in admin. `completed` and the per-section states beyond `account` fill in as the
        wizard's sections arrive.
      tags: [setup]
      responses:
        "200":
          description: Where the setup wizard stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setup"
        default:
          $ref: "#/components/responses/Problem"
  /setup/account:
    post:
      operationId: createAccount
      summary: Create the admin account and log in
      description: |
        Only answers while no account exists; whoever reaches a fresh instance sets the credentials.
        Responds with the session cookie, so finishing this step logs the admin in.
      tags: [setup]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: The account was created and a session started.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /setup/complete:
    post:
      operationId: completeSetup
      summary: Finish setup
      description: |
        Marks setup finished when every section of `GET /setup` is `done`. Otherwise answers 422
        with one error per missing section, `field` being `sections.<name>` and `code` `todo`.
        The optional Adopt existing library step never blocks it.
      tags: [setup]
      responses:
        "204":
          description: Setup is finished.
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/login:
    post:
      operationId: login
      summary: Log in with username and password
      description: |
        Sets a 30-day sliding session cookie. After five failures from one client address within
        15 minutes further attempts are answered `429 rate_limited` with `Retry-After`, backing off
        up to 15 minutes. A success resets the count.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "204":
          description: Logged in.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
        "401":
          $ref: "#/components/responses/Problem"
        "429":
          description: Too many failed attempts.
          headers:
            Retry-After:
              description: Seconds until the next attempt is accepted.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/logout:
    post:
      operationId: logout
      summary: End the current session
      tags: [auth]
      responses:
        "204":
          description: Logged out; the cookie is cleared.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
        default:
          $ref: "#/components/responses/Problem"
  /auth/logout-everywhere:
    post:
      operationId: logoutEverywhere
      summary: End every session, including this one
      tags: [auth]
      responses:
        "204":
          description: All sessions ended; the cookie is cleared.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
        default:
          $ref: "#/components/responses/Problem"
  /auth/me:
    get:
      operationId: getMe
      summary: Who is logged in
      description: |
        The SPA's first call. `401 setup_required` means no account exists yet (show the wizard's
        Account section); `401 unauthenticated` means show the login card.
      tags: [auth]
      responses:
        "200":
          description: The current admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
  /account/password:
    post:
      operationId: changePassword
      summary: Change the admin password
      description: Ends every other session; the current one stays logged in.
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                  writeOnly: true
                new_password:
                  type: string
                  writeOnly: true
                  minLength: 8
      responses:
        "204":
          description: Password changed.
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api-key:
    get:
      operationId: getApiKey
      summary: The API key's prefix and age
      description: |
        There is at most one full-access key. Only its prefix and creation time are ever shown;
        both are `null` until a key has been generated.
      tags: [account]
      responses:
        "200":
          description: The key's public details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyInfo"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createApiKey
      summary: Generate or rotate the API key
      description: |
        Replaces any existing key, which stops working at once. The new key is in this response
        only; Kestrel keeps just its SHA-256. Send it as `X-Api-Key`.
      tags: [account]
      responses:
        "201":
          description: The new key, shown exactly once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewApiKey"
        default:
          $ref: "#/components/responses/Problem"
  /settings/reverse-proxy:
    get:
      operationId: getReverseProxy
      summary: Reverse-proxy login settings
      tags: [settings]
      responses:
        "200":
          description: The settings and the untrusted sightings recorded so far.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReverseProxy"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: putReverseProxy
      summary: Change reverse-proxy login settings
      description: |
        Off by default. When enabled, a non-empty `header` from a trusted proxy address logs the
        admin in for that request. The same header from any other address is ignored and
        recorded under `untrusted`.
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReverseProxySettings"
      responses:
        "200":
          description: The settings as saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReverseProxy"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /settings:
    get:
      operationId: getSettings
      summary: App settings
      description: |
        The settings sections that exist so far: `language_region`, `kids_rule` and `root_folders`. Sections never
        saved report their defaults (English, US, Kids rule on at age 6); `GET /setup` says which
        were saved. Reverse-proxy login settings have their own endpoint.
      tags: [settings]
      responses:
        "200":
          description: Every section.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: patchSettings
      summary: Change settings
      description: |
        A JSON merge patch over the sections: send only what changes. Changing `primary_language`
        re-points the eight Profiles to their backing TRaSH profiles and, unless the same patch
        names `release_date_country`, moves the country to the new language's default. It affects
        scoring and Grabs from then on; files already stored are left alone.
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsPatch"
      responses:
        "200":
          description: Every section as saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /profiles:
    get:
      operationId: listProfiles
      summary: The eight Profiles
      description: In display order. Profiles are named by `key`, never by id.
      tags: [profiles]
      responses:
        "200":
          description: The Profiles with their settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileList"
        default:
          $ref: "#/components/responses/Problem"
  /profiles/{key}:
    parameters:
      - $ref: "#/components/parameters/ProfileKey"
    patch:
      operationId: patchProfile
      summary: Change a Profile's settings
      description: |
        A Slot has at most one default Profile per kind: making one the default replaces the old.
        HD always keeps exactly one default per kind, so unsetting or disabling it is a `validation`
        error until another HD Profile is the default. Disabling a Profile clears its defaults, and
        a disabled Profile cannot be made a default. `original_fallback` is a `validation` error on
        Original-Language Profiles.
      tags: [profiles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfilePatch"
      responses:
        "200":
          description: The Profile as saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /lookup:
    get:
      operationId: lookup
      summary: Search the metadata provider for Titles to add
      description: |
        One TMDB search across both kinds, in English, newest relevance first. Results already in the
        Library carry their Title id in `in_library`. Only Movies can be added so far, so Series
        results are left out until Series can be added.
        `502 upstream_unavailable` means TMDB could not be reached or refused the key.
      tags: [titles]
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TitleKind"
      responses:
        "200":
          description: The matches.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LookupList"
        "422":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /lookup/{kind}/{tmdb_id}:
    parameters:
      - name: kind
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/TitleKind"
      - name: tmdb_id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: lookupTitle
      summary: One search result with the add panel's suggested Slots and Profiles
      description: |
        The Slots to preselect when adding it: every Slot with a default Profile for the kind, resolved
        by Profile resolution, with the Kids rule applied to HD when the Title's certification in the
        release-date country reads as a kids' age. Each Slot says why (`reason`) and carries a display
        `label`, such as "Kids (FSK 6)". Requests use the same logic.
      tags: [titles]
      responses:
        "200":
          description: The Title and the suggestion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LookupDetail"
        "404":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /titles:
    get:
      operationId: listTitles
      summary: The Library's Titles as compact rows
      description: |
        Newest first. The SPA loads the whole Library once with `limit=10000` and filters locally.
        `q` matches titles and aliases, ignoring case.
      tags: [titles]
      parameters:
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/TitleKind"
        - name: q
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 100
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: A page of rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleList"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createTitle
      summary: Add a Title to the Library
      description: |
        Fetches the Title from the metadata provider and adds it with the named Versions, each Wanted.
        `root_folder` must be one of the configured Root folders for the kind; left out, it is the
        first. `409 conflict` when the Title is already in the Library (the existing id is in
        `detail`). Only Movies can be added so far.
      tags: [titles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TitleCreate"
      responses:
        "201":
          description: The new Title.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleDetail"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /titles/{id}:
    parameters:
      - $ref: "#/components/parameters/TitleId"
    get:
      operationId: getTitle
      summary: One Title with its Versions
      tags: [titles]
      responses:
        "200":
          description: The Title.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleDetail"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /titles/{id}/poster:
    parameters:
      - $ref: "#/components/parameters/TitleId"
    get:
      operationId: getTitlePoster
      summary: The Title's poster
      description: Served from the poster cache under the config dir, fetched on first use. `404` when the provider has none.
      tags: [titles]
      responses:
        "200":
          description: A JPEG.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /plugins:
    get:
      operationId: listPlugins
      summary: The built-in plugins and their config schemas
      description: |
        One manifest per compiled-in plugin, any contract. The UI draws each plugin's form from
        `fields`, so a new adapter needs no UI change.
      tags: [plugins]
      responses:
        "200":
          description: Every plugin manifest, ordered by contract then id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginList"
        default:
          $ref: "#/components/responses/Problem"
  /plugins/{plugin_id}/options/{field}:
    post:
      operationId: listPluginOptions
      summary: Live choices for a config field
      description: |
        Asks the plugin for the current values of a `live` field (SABnzbd's categories) using the
        form as it stands. `config` is merged over the stored instance when `instance_id` is given,
        so a saved secret need not be sent again. The config is not validated as a whole, because the
        form may be half filled. A plugin failure is `502 upstream_unavailable`.
      tags: [plugins]
      parameters:
        - $ref: "#/components/parameters/PluginId"
        - name: field
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PluginForm"
      responses:
        "200":
          description: The choices.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginOptionList"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /plugin-instances:
    get:
      operationId: listPluginInstances
      summary: Configured plugin instances
      tags: [plugins]
      responses:
        "200":
          description: Every instance of every contract. Secrets are never included.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginInstanceList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createPluginInstance
      summary: Configure a plugin instance
      description: |
        Absent config fields take the manifest default. Secret fields are accepted here and never
        returned: `secrets_set` lists which are set. Enabling an instance beyond its contract's cap
        (one enabled download client in v1) is a `validation` error on `enabled`.
      tags: [plugins]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PluginInstanceCreate"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginInstance"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /plugin-instances/test:
    post:
      operationId: testPluginConfig
      summary: Test an unsaved plugin config
      description: |
        Runs the plugin's live test with the given config. A failing test is still `200` with
        `ok: false` and the plugin's error `code`; only a malformed config is `422`.
      tags: [plugins]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PluginTestRequest"
      responses:
        "200":
          description: The test outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginTestResult"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /plugin-instances/{id}:
    parameters:
      - $ref: "#/components/parameters/InstanceId"
    get:
      operationId: getPluginInstance
      summary: One plugin instance
      tags: [plugins]
      responses:
        "200":
          description: The instance. Secrets are never included.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginInstance"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updatePluginInstance
      summary: Change a plugin instance
      description: |
        `config` merges key by key. A secret that is omitted stays as it is, a string replaces it
        and `null` clears it; clearing any other field returns it to its default.
      tags: [plugins]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PluginInstancePatch"
      responses:
        "200":
          description: The updated instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginInstance"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deletePluginInstance
      summary: Remove a plugin instance
      tags: [plugins]
      responses:
        "204":
          description: Removed.
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /plugin-instances/{id}/test:
    parameters:
      - $ref: "#/components/parameters/InstanceId"
    post:
      operationId: testPluginInstance
      summary: Test a saved plugin instance
      description: |
        Like the unsaved test, with the stored config (secrets included) underneath the optional
        `config` edits, so a form can be tested before it is saved without retyping the secret.
      tags: [plugins]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                config:
                  $ref: "#/components/schemas/PluginConfigPatch"
      responses:
        "200":
          description: The test outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginTestResult"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
components:
  parameters:
    PluginId:
      name: plugin_id
      in: path
      required: true
      schema:
        type: string
    InstanceId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    TitleId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ProfileKey:
      name: key
      in: path
      required: true
      schema:
        type: string
        enum: [sd-primary, sd-original, hd-primary, hd-original, kids-primary, kids-original, uhd-primary, uhd-original]
  headers:
    SetCookie:
      description: The `kestrel_session` cookie (HttpOnly, SameSite=Lax, Path from KESTREL_BASE_URL).
      schema:
        type: string
  responses:
    Problem:
      description: An error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    System:
      type: object
      required: [version, api_major, base_url]
      properties:
        version:
          type: string
          description: Kestrel release version, or `dev` for local builds.
          example: 0.1.0
        api_major:
          type: integer
          description: Major version of this API (the `N` in `/api/vN`).
          example: 1
        base_url:
          type: string
          description: The routing prefix from KESTREL_BASE_URL, empty when unset.
          example: /kestrel
    ApiKeyInfo:
      type: object
      required: [prefix, created_at]
      properties:
        prefix:
          type: string
          nullable: true
          description: The first characters of the key, for recognising it.
          example: kst_ABCD
        created_at:
          type: string
          format: date-time
          nullable: true
    NewApiKey:
      type: object
      required: [key]
      properties:
        key:
          type: string
          description: The whole key, `kst_` plus 52 base32 characters.
    ReverseProxySettings:
      type: object
      required: [enabled, trusted_proxies, header]
      properties:
        enabled:
          type: boolean
        trusted_proxies:
          type: array
          description: Addresses or CIDR ranges of the proxies whose header is believed.
          items:
            type: string
          example: ["172.18.0.0/16", "10.0.0.5"]
        header:
          type: string
          description: The header carrying the user name.
          example: Remote-User
    ReverseProxy:
      allOf:
        - $ref: "#/components/schemas/ReverseProxySettings"
        - type: object
          required: [untrusted]
          properties:
            untrusted:
              type: array
              readOnly: true
              description: Addresses that sent the header without being trusted, newest first.
              items:
                $ref: "#/components/schemas/UntrustedProxyHeader"
    UntrustedProxyHeader:
      type: object
      required: [ip, value, count, last_seen]
      properties:
        ip:
          type: string
        value:
          type: string
          description: The header value from the latest request.
        count:
          type: integer
        last_seen:
          type: string
          format: date-time
    Credentials:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 8
    Me:
      type: object
      required: [username, method, proxy_user]
      properties:
        username:
          type: string
        method:
          type: string
          enum: [session, proxy, api_key]
          description: How this request was authenticated.
        proxy_user:
          type: string
          nullable: true
          description: The reverse-proxy header value, when `method` is `proxy`.
    Setup:
      type: object
      required: [account_exists, completed, sections]
      properties:
        account_exists:
          type: boolean
        completed:
          type: boolean
        sections:
          type: object
          required: [account, language, download_client, indexer, root_folders, profiles]
          properties:
            account:
              $ref: "#/components/schemas/SetupSectionState"
            language:
              $ref: "#/components/schemas/SetupSectionState"
            download_client:
              $ref: "#/components/schemas/SetupSectionState"
            indexer:
              $ref: "#/components/schemas/SetupSectionState"
            root_folders:
              $ref: "#/components/schemas/SetupSectionState"
            profiles:
              $ref: "#/components/schemas/SetupSectionState"
    PrimaryLanguage:
      type: string
      description: The household's Primary Language as ISO 639-1.
      enum: [en, de, fr]
    Settings:
      type: object
      required: [language_region, kids_rule, root_folders]
      properties:
        root_folders:
          $ref: "#/components/schemas/RootFolders"
        language_region:
          type: object
          required: [primary_language, release_date_country]
          properties:
            primary_language:
              $ref: "#/components/schemas/PrimaryLanguage"
            release_date_country:
              type: string
              description: ISO 3166-1 alpha-2. "Released" and the Kids rule's certifications follow it.
              example: DE
        kids_rule:
          type: object
          required: [enabled, threshold]
          properties:
            enabled:
              type: boolean
            threshold:
              type: integer
              description: Titles certified at or below this age get the Kids Profile in HD.
              enum: [0, 6, 12]
    RootFolders:
      type: object
      required: [movies, series]
      description: |
        Where Imports put Titles, one or more absolute paths per kind. The first is the default when
        adding a Title. Unsaved, they report `<data dir>/media/movies` and `<data dir>/media/tv`.
      properties:
        movies:
          type: array
          minItems: 1
          items:
            type: string
        series:
          type: array
          minItems: 1
          items:
            type: string
    SettingsPatch:
      type: object
      properties:
        root_folders:
          type: object
          description: Replaces the named lists. Each path must exist, be a directory and be writable (`not_found`, `not_directory`, `not_writable`, `not_absolute`, `required`).
          properties:
            movies:
              type: array
              items:
                type: string
            series:
              type: array
              items:
                type: string
        language_region:
          type: object
          properties:
            primary_language:
              $ref: "#/components/schemas/PrimaryLanguage"
            release_date_country:
              type: string
        kids_rule:
          type: object
          properties:
            enabled:
              type: boolean
            threshold:
              type: integer
    Slot:
      type: string
      enum: [sd, hd, uhd]
    Profile:
      type: object
      required: [key, name, slot, language_rule, original_fallback, enabled, default_movies, default_series, min_height, max_height, trash_profile_movies, trash_profile_series]
      properties:
        key:
          type: string
          example: hd-primary
        name:
          type: string
          example: HD
        slot:
          $ref: "#/components/schemas/Slot"
        language_rule:
          type: string
          description: Which audio the Profile requires.
          enum: [primary, original]
        original_fallback:
          type: boolean
          description: Accept a Release with the Title's Original Language but no Primary-Language audio. Always false on Original-Language Profiles.
        enabled:
          type: boolean
        default_movies:
          type: boolean
        default_series:
          type: boolean
        min_height:
          type: integer
        max_height:
          type: integer
        trash_profile_movies:
          type: string
          description: The TRaSH profile file (without .json) backing the Profile for Movies under the current Primary Language.
        trash_profile_series:
          type: string
          description: The same for Series.
    ProfileList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Profile"
    ProfilePatch:
      type: object
      properties:
        enabled:
          type: boolean
        original_fallback:
          type: boolean
        default_movies:
          type: boolean
        default_series:
          type: boolean
    SetupSectionState:
      type: string
      enum: [done, todo]
    PluginConfigPatch:
      type: object
      description: |
        Plugin settings by manifest field key. Secret fields are write-only: they are accepted
        here and never returned. In a patch, `null` clears a field.
      additionalProperties: true
    PluginOption:
      type: object
      required: [value, label]
      properties:
        value:
          type: string
        label:
          type: string
    PluginField:
      type: object
      required: [key, label, type, required, default, help, options, live]
      properties:
        key:
          type: string
        label:
          type: string
        type:
          type: string
          enum: [text, url, secret, int, bool, select]
        required:
          type: boolean
        default:
          nullable: true
          description: The value used when the field is absent, or `null`.
        help:
          type: string
        options:
          type: array
          description: The fixed choices of a `select` field.
          items:
            $ref: "#/components/schemas/PluginOption"
        live:
          type: boolean
          description: |
            Choices come from `POST /plugins/{plugin_id}/options/{field}` once the connection works.
            Until then the field is free text.
    PluginManifest:
      type: object
      required: [id, name, contract, version, capabilities, fields]
      properties:
        id:
          type: string
          example: sabnzbd
        name:
          type: string
        contract:
          type: string
          description: The versioned plugin contract, e.g. `download_client.v1`.
          example: download_client.v1
        version:
          type: string
        capabilities:
          type: object
          description: "Contract-specific facts, e.g. protocols: [usenet]."
          additionalProperties:
            type: array
            items:
              type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/PluginField"
    PluginList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PluginManifest"
        next_cursor:
          type: string
          nullable: true
    PluginOptionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PluginOption"
    PluginForm:
      type: object
      required: [config]
      properties:
        config:
          $ref: "#/components/schemas/PluginConfigPatch"
        instance_id:
          type: integer
          format: int64
          nullable: true
          description: A saved instance whose stored config, secrets included, lies under `config`.
    PluginInstance:
      type: object
      required: [id, contract, plugin_id, name, enabled, priority, config, secrets_set]
      properties:
        id:
          type: integer
          format: int64
        contract:
          type: string
        plugin_id:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        priority:
          type: integer
        config:
          type: object
          description: Every non-secret manifest field, `null` for none.
          additionalProperties: true
        secrets_set:
          type: array
          description: Keys of the secret fields that have a value. The values are never returned.
          items:
            type: string
    PluginInstanceList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PluginInstance"
        next_cursor:
          type: string
          nullable: true
    PluginInstanceCreate:
      type: object
      required: [plugin_id, name, config]
      properties:
        plugin_id:
          type: string
        name:
          type: string
          minLength: 1
        enabled:
          type: boolean
          description: Defaults to true when absent.
        priority:
          type: integer
          description: Defaults to 0 when absent.
        config:
          $ref: "#/components/schemas/PluginConfigPatch"
    PluginInstancePatch:
      type: object
      properties:
        name:
          type: string
        enabled:
          type: boolean
        priority:
          type: integer
        config:
          $ref: "#/components/schemas/PluginConfigPatch"
    PluginTestRequest:
      type: object
      required: [plugin_id, config]
      properties:
        plugin_id:
          type: string
        config:
          $ref: "#/components/schemas/PluginConfigPatch"
    PluginTestResult:
      type: object
      required: [ok, code, message]
      properties:
        ok:
          type: boolean
        code:
          type: string
          nullable: true
          description: |
            Why the test failed, `null` when it passed: `auth`, `unavailable`, `rate_limited`,
            `invalid` or `not_found`. Clients tolerate new values.
        message:
          type: string
    TitleKind:
      type: string
      enum: [movie, series]
    SlotState:
      type: string
      description: |
        `wanted` (monitored, released, no file), `filled`, `downloading`, `unmonitored` or `unreleased`.
        Clients tolerate new values.
      enum: [wanted, filled, downloading, unmonitored, unreleased]
    LookupResult:
      type: object
      required: [kind, tmdb_id, tvdb_id, title, year, poster, in_library, addable, not_addable_reason]
      properties:
        kind:
          $ref: "#/components/schemas/TitleKind"
        tmdb_id:
          type: integer
        tvdb_id:
          type: integer
          nullable: true
        title:
          type: string
        year:
          type: integer
          nullable: true
        poster:
          type: string
          nullable: true
          description: A small TMDB poster URL.
        in_library:
          type: integer
          format: int64
          nullable: true
          description: The Title id when it is already in the Library.
        addable:
          type: boolean
        not_addable_reason:
          type: string
          nullable: true
          description: "`not_on_tvdb` for a Series TheTVDB does not have; `null` when addable. Clients tolerate new values."
    LookupList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LookupResult"
        next_cursor:
          type: string
          nullable: true
    SuggestedSlot:
      type: object
      required: [slot, profile, label, reason]
      properties:
        slot:
          $ref: "#/components/schemas/Slot"
        profile:
          type: string
          description: The Profile key.
          example: kids-primary
        label:
          type: string
          example: Kids (FSK 6)
        reason:
          type: string
          description: "`default` (the Slot's default Profile) or `kids_rule` (the Kids rule swapped HD for its Kids Profile). Clients tolerate new values."
          enum: [default, kids_rule]
    LookupDetail:
      type: object
      required: [kind, tmdb_id, title, year, overview, in_library, certification, certification_country, slots]
      properties:
        kind:
          $ref: "#/components/schemas/TitleKind"
        tmdb_id:
          type: integer
        title:
          type: string
        year:
          type: integer
          nullable: true
        overview:
          type: string
        in_library:
          type: integer
          format: int64
          nullable: true
        certification:
          type: string
          nullable: true
          description: The rating the Kids rule read, as TMDB writes it ("6", "PG").
        certification_country:
          type: string
          nullable: true
          description: The country that rating is from; the release-date country unless TMDB had none there.
        slots:
          type: array
          description: Every Slot with a default Profile for the kind, in Slot order.
          items:
            $ref: "#/components/schemas/SuggestedSlot"
    VersionRef:
      type: object
      required: [slot, profile]
      properties:
        slot:
          $ref: "#/components/schemas/Slot"
        profile:
          type: string
          description: The Profile key. It must be an enabled Profile of that Slot.
    TitleCreate:
      type: object
      required: [kind, tmdb_id, versions]
      properties:
        kind:
          $ref: "#/components/schemas/TitleKind"
        tmdb_id:
          type: integer
        versions:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/VersionRef"
        root_folder:
          type: string
          nullable: true
    SlotSummary:
      type: object
      required: [version_id, profile, state, long_missing]
      properties:
        version_id:
          type: integer
          format: int64
        profile:
          type: string
        state:
          $ref: "#/components/schemas/SlotState"
        long_missing:
          type: boolean
    TitleRow:
      type: object
      required: [id, kind, title, primary_title, year, slots, wanted_since, added_at]
      properties:
        id:
          type: integer
          format: int64
        kind:
          $ref: "#/components/schemas/TitleKind"
        title:
          type: string
          description: The English title.
        primary_title:
          type: string
          description: The title in the Primary Language; the English title when TMDB has no translation.
        year:
          type: integer
          nullable: true
        slots:
          type: object
          required: [sd, hd, uhd]
          properties:
            sd:
              allOf:
                - $ref: "#/components/schemas/SlotSummary"
              nullable: true
            hd:
              allOf:
                - $ref: "#/components/schemas/SlotSummary"
              nullable: true
            uhd:
              allOf:
                - $ref: "#/components/schemas/SlotSummary"
              nullable: true
        wanted_since:
          type: string
          format: date-time
          nullable: true
        added_at:
          type: string
          format: date-time
    TitleList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TitleRow"
        next_cursor:
          type: string
          nullable: true
    FileSummary:
      type: object
      required: [path, size, release_name, score, imported_at]
      properties:
        path:
          type: string
        size:
          type: integer
          format: int64
        release_name:
          type: string
        score:
          type: integer
          nullable: true
        imported_at:
          type: string
          format: date-time
    VersionDetail:
      type: object
      required: [id, slot, profile, state, long_missing, wanted_since, file, added_at]
      properties:
        id:
          type: integer
          format: int64
        slot:
          $ref: "#/components/schemas/Slot"
        profile:
          type: string
        state:
          $ref: "#/components/schemas/SlotState"
        long_missing:
          type: boolean
        wanted_since:
          type: string
          format: date-time
          nullable: true
        file:
          allOf:
            - $ref: "#/components/schemas/FileSummary"
          nullable: true
        added_at:
          type: string
          format: date-time
    ReleaseDateEntry:
      type: object
      required: [country, type, date, certification]
      properties:
        country:
          type: string
        type:
          type: string
          enum: [premiere, theatrical_limited, theatrical, digital, physical, tv]
        date:
          type: string
          format: date-time
        certification:
          type: string
          nullable: true
    TitleDetail:
      type: object
      required: [id, kind, tmdb_id, tvdb_id, imdb_id, title, original_title, primary_title, year, original_language, overview, runtime, has_poster, monitored, metadata_frozen, root_folder, folder, added_at, refreshed_at, certification, release_dates, versions]
      properties:
        id:
          type: integer
          format: int64
        kind:
          $ref: "#/components/schemas/TitleKind"
        tmdb_id:
          type: integer
          nullable: true
        tvdb_id:
          type: integer
          nullable: true
        imdb_id:
          type: string
          nullable: true
        title:
          type: string
        original_title:
          type: string
        primary_title:
          type: string
        year:
          type: integer
          nullable: true
        original_language:
          type: string
          description: ISO 639-1; empty when unknown.
        overview:
          type: string
        runtime:
          type: integer
          nullable: true
          description: Minutes.
        has_poster:
          type: boolean
          description: Whether `GET /titles/{id}/poster` has an image.
        monitored:
          type: boolean
        metadata_frozen:
          type: boolean
        root_folder:
          type: string
        folder:
          type: string
          nullable: true
          description: The Title's folder name; set by its first Import.
        added_at:
          type: string
          format: date-time
        refreshed_at:
          type: string
          format: date-time
        certification:
          type: string
          nullable: true
          description: The certification in the release-date country, with the same fallback as the Kids rule.
        release_dates:
          type: array
          description: Every dated release TMDB lists, in any country.
          items:
            $ref: "#/components/schemas/ReleaseDateEntry"
        versions:
          type: array
          description: In Slot order.
          items:
            $ref: "#/components/schemas/VersionDetail"
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: |
            Stable machine-readable code from a closed, growable list. Clients branch on this,
            never on the message text.
          example: internal
        errors:
          type: array
          description: Field-level problems for `validation` errors.
          items:
            type: object
            required: [field, code, message]
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
