openapi: 3.0.3
info:
  title: Kestrel API
  version: "1"
  description: |
    The Kestrel REST API, shared by the web UI, the Silo router plugin and outside scripts.
    This file is the source of truth: Go handlers and the TypeScript client are generated from it.

    Compatibility within `v1` is additive only: new fields, endpoints and enum values.
    Clients must ignore unknown fields and tolerate unknown enum values.
    A breaking change means `/api/v2` and a Kestrel major release.

    Conventions: `snake_case` fields, integer ids, RFC 3339 UTC times, lowercase string enums,
    every field always present (`null` for "none"), errors as RFC 9457 `application/problem+json`
    with a stable `code`.
servers:
  - url: /api/v1
    description: Relative to the instance's KESTREL_BASE_URL, if any.
paths:
  /system:
    get:
      operationId: getSystem
      summary: Version and API major of this instance
      description: |
        The Silo plugin's `TestConnection` reads `api_major`.
        Unauthenticated until an account exists.
      tags: [system]
      responses:
        "200":
          description: The running instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/System"
        default:
          $ref: "#/components/responses/Problem"
  /setup:
    get:
      operationId: getSetup
      summary: Setup progress
      description: |
        Answers before an account exists (one of the few endpoints that do), and afterwards to
        a logged-in admin. `completed` and the per-section states beyond `account` fill in as the
        wizard's sections arrive.
      tags: [setup]
      responses:
        "200":
          description: Where the setup wizard stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setup"
        default:
          $ref: "#/components/responses/Problem"
  /setup/account:
    post:
      operationId: createAccount
      summary: Create the admin account and log in
      description: |
        Only answers while no account exists; whoever reaches a fresh instance sets the credentials.
        Responds with the session cookie, so finishing this step logs the admin in.
      tags: [setup]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: The account was created and a session started.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/login:
    post:
      operationId: login
      summary: Log in with username and password
      description: |
        Sets a 30-day sliding session cookie. After five failures from one client address within
        15 minutes further attempts are answered `429 rate_limited` with `Retry-After`, backing off
        up to 15 minutes. A success resets the count.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "204":
          description: Logged in.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
        "401":
          $ref: "#/components/responses/Problem"
        "429":
          description: Too many failed attempts.
          headers:
            Retry-After:
              description: Seconds until the next attempt is accepted.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/logout:
    post:
      operationId: logout
      summary: End the current session
      tags: [auth]
      responses:
        "204":
          description: Logged out; the cookie is cleared.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
        default:
          $ref: "#/components/responses/Problem"
  /auth/logout-everywhere:
    post:
      operationId: logoutEverywhere
      summary: End every session, including this one
      tags: [auth]
      responses:
        "204":
          description: All sessions ended; the cookie is cleared.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
        default:
          $ref: "#/components/responses/Problem"
  /auth/me:
    get:
      operationId: getMe
      summary: Who is logged in
      description: |
        The SPA's first call. `401 setup_required` means no account exists yet (show the wizard's
        Account section); `401 unauthenticated` means show the login card.
      tags: [auth]
      responses:
        "200":
          description: The current admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
  /account/password:
    post:
      operationId: changePassword
      summary: Change the admin password
      description: Ends every other session; the current one stays logged in.
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                  writeOnly: true
                new_password:
                  type: string
                  writeOnly: true
                  minLength: 8
      responses:
        "204":
          description: Password changed.
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api-key:
    get:
      operationId: getApiKey
      summary: The API key's prefix and age
      description: |
        There is at most one full-access key. Only its prefix and creation time are ever shown;
        both are `null` until a key has been generated.
      tags: [account]
      responses:
        "200":
          description: The key's public details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyInfo"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createApiKey
      summary: Generate or rotate the API key
      description: |
        Replaces any existing key, which stops working at once. The new key is in this response
        only; Kestrel keeps just its SHA-256. Send it as `X-Api-Key`.
      tags: [account]
      responses:
        "201":
          description: The new key, shown exactly once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewApiKey"
        default:
          $ref: "#/components/responses/Problem"
  /settings/reverse-proxy:
    get:
      operationId: getReverseProxy
      summary: Reverse-proxy login settings
      tags: [settings]
      responses:
        "200":
          description: The settings and the untrusted sightings recorded so far.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReverseProxy"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: putReverseProxy
      summary: Change reverse-proxy login settings
      description: |
        Off by default. When enabled, a non-empty `header` from a trusted proxy address logs the
        admin in for that request. The same header from any other address is ignored and
        recorded under `untrusted`.
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReverseProxySettings"
      responses:
        "200":
          description: The settings as saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReverseProxy"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
components:
  headers:
    SetCookie:
      description: The `kestrel_session` cookie (HttpOnly, SameSite=Lax, Path from KESTREL_BASE_URL).
      schema:
        type: string
  responses:
    Problem:
      description: An error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    System:
      type: object
      required: [version, api_major, base_url]
      properties:
        version:
          type: string
          description: Kestrel release version, or `dev` for local builds.
          example: 0.1.0
        api_major:
          type: integer
          description: Major version of this API (the `N` in `/api/vN`).
          example: 1
        base_url:
          type: string
          description: The routing prefix from KESTREL_BASE_URL, empty when unset.
          example: /kestrel
    ApiKeyInfo:
      type: object
      required: [prefix, created_at]
      properties:
        prefix:
          type: string
          nullable: true
          description: The first characters of the key, for recognising it.
          example: kst_ABCD
        created_at:
          type: string
          format: date-time
          nullable: true
    NewApiKey:
      type: object
      required: [key]
      properties:
        key:
          type: string
          description: The whole key, `kst_` plus 52 base32 characters.
    ReverseProxySettings:
      type: object
      required: [enabled, trusted_proxies, header]
      properties:
        enabled:
          type: boolean
        trusted_proxies:
          type: array
          description: Addresses or CIDR ranges of the proxies whose header is believed.
          items:
            type: string
          example: ["172.18.0.0/16", "10.0.0.5"]
        header:
          type: string
          description: The header carrying the user name.
          example: Remote-User
    ReverseProxy:
      allOf:
        - $ref: "#/components/schemas/ReverseProxySettings"
        - type: object
          required: [untrusted]
          properties:
            untrusted:
              type: array
              readOnly: true
              description: Addresses that sent the header without being trusted, newest first.
              items:
                $ref: "#/components/schemas/UntrustedProxyHeader"
    UntrustedProxyHeader:
      type: object
      required: [ip, value, count, last_seen]
      properties:
        ip:
          type: string
        value:
          type: string
          description: The header value from the latest request.
        count:
          type: integer
        last_seen:
          type: string
          format: date-time
    Credentials:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 8
    Me:
      type: object
      required: [username, method, proxy_user]
      properties:
        username:
          type: string
        method:
          type: string
          enum: [session, proxy, api_key]
          description: How this request was authenticated.
        proxy_user:
          type: string
          nullable: true
          description: The reverse-proxy header value, when `method` is `proxy`.
    Setup:
      type: object
      required: [account_exists, completed, sections]
      properties:
        account_exists:
          type: boolean
        completed:
          type: boolean
        sections:
          type: object
          required: [account, language, download_client, indexer, root_folders, profiles]
          properties:
            account:
              $ref: "#/components/schemas/SetupSectionState"
            language:
              $ref: "#/components/schemas/SetupSectionState"
            download_client:
              $ref: "#/components/schemas/SetupSectionState"
            indexer:
              $ref: "#/components/schemas/SetupSectionState"
            root_folders:
              $ref: "#/components/schemas/SetupSectionState"
            profiles:
              $ref: "#/components/schemas/SetupSectionState"
    SetupSectionState:
      type: string
      enum: [done, todo]
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: |
            Stable machine-readable code from a closed, growable list. Clients branch on this,
            never on the message text.
          example: internal
        errors:
          type: array
          description: Field-level problems for `validation` errors.
          items:
            type: object
            required: [field, code, message]
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
