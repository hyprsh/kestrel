openapi: 3.0.3
info:
  title: Kestrel API
  version: "1"
  description: |
    The Kestrel REST API, shared by the web UI, the Silo router plugin and outside scripts.
    This file is the source of truth: Go handlers and the TypeScript client are generated from it.

    Compatibility within `v1` is additive only: new fields, endpoints and enum values.
    Clients must ignore unknown fields and tolerate unknown enum values.
    A breaking change means `/api/v2` and a Kestrel major release.

    Conventions: `snake_case` fields, integer ids, RFC 3339 UTC times, lowercase string enums,
    every field always present (`null` for "none"), errors as RFC 9457 `application/problem+json`
    with a stable `code`.

    A deployment may name a Config File with `KESTREL_CONFIG_FILE`. The sections and plugin
    instances it declares can't be changed here: a write to one answers `409 conflict`, with a
    `detail` naming the file, and reads report `from_config_file`. Without a Config File every
    `from_config_file` is `false`.
servers:
  - url: /api/v1
    description: Relative to the instance's KESTREL_BASE_URL, if any.
paths:
  /system:
    get:
      operationId: getSystem
      summary: Version and API major of this instance
      description: |
        The Silo plugin's `TestConnection` reads `api_major`.
        Unauthenticated until an account exists.
      tags: [system]
      responses:
        "200":
          description: The running instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/System"
        default:
          $ref: "#/components/responses/Problem"
  /setup:
    get:
      operationId: getSetup
      summary: Setup progress
      description: |
        Answers before an account exists (one of the few endpoints that do), and afterwards to
        a logged-in admin. `completed` and the per-section states beyond `account` fill in as the
        wizard's sections arrive.
      tags: [setup]
      responses:
        "200":
          description: Where the setup wizard stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setup"
        default:
          $ref: "#/components/responses/Problem"
  /setup/account:
    post:
      operationId: createAccount
      summary: Create the admin account and log in
      description: |
        Only answers while no account exists; whoever reaches a fresh instance sets the credentials.
        Responds with the session cookie, so finishing this step logs the admin in. `409 conflict`
        once an account exists, or while the Config File declares it.
      tags: [setup]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: The account was created and a session started.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /setup/complete:
    post:
      operationId: completeSetup
      summary: Finish setup
      description: |
        Marks setup finished when every section of `GET /setup` is `done`. Otherwise answers 422
        with one error per missing section, `field` being `sections.<name>` and `code` `todo`.
        The optional Adopt existing library step never blocks it.
      tags: [setup]
      responses:
        "204":
          description: Setup is finished.
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/login:
    post:
      operationId: login
      summary: Log in with username and password
      description: |
        Sets a 30-day sliding session cookie. After five failures from one client address within
        15 minutes further attempts are answered `429 rate_limited` with `Retry-After`, backing off
        up to 15 minutes. A success resets the count.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "204":
          description: Logged in.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
        "401":
          $ref: "#/components/responses/Problem"
        "429":
          description: Too many failed attempts.
          headers:
            Retry-After:
              description: Seconds until the next attempt is accepted.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/logout:
    post:
      operationId: logout
      summary: End the current session
      tags: [auth]
      responses:
        "204":
          description: Logged out; the cookie is cleared.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
        default:
          $ref: "#/components/responses/Problem"
  /auth/logout-everywhere:
    post:
      operationId: logoutEverywhere
      summary: End every session, including this one
      tags: [auth]
      responses:
        "204":
          description: All sessions ended; the cookie is cleared.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
        default:
          $ref: "#/components/responses/Problem"
  /auth/me:
    get:
      operationId: getMe
      summary: Who is logged in
      description: |
        The SPA's first call. `401 setup_required` means no account exists yet (show the wizard's
        Account section); `401 unauthenticated` means show the login card.
      tags: [auth]
      responses:
        "200":
          description: The current admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
  /account/password:
    post:
      operationId: changePassword
      summary: Change the admin password
      description: |
        Ends every other session; the current one stays logged in. `409 conflict` while the Config
        File declares the account.
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                  writeOnly: true
                new_password:
                  type: string
                  writeOnly: true
                  minLength: 8
      responses:
        "204":
          description: Password changed.
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api-key:
    get:
      operationId: getApiKey
      summary: The API key's prefix and age
      description: |
        There is at most one full-access key. Only its prefix and creation time are ever shown;
        both are `null` until a key has been generated. While `KESTREL_API_KEY` is set, that is
        the key, `from_environment` is `true` and `created_at` is when Kestrel started.
      tags: [account]
      responses:
        "200":
          description: The key's public details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyInfo"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createApiKey
      summary: Generate or rotate the API key
      description: |
        Replaces any existing key, which stops working at once. The new key is in this response
        only; Kestrel keeps just its SHA-256. Send it as `X-Api-Key`. `409 conflict` while
        `KESTREL_API_KEY` sets the key.
      tags: [account]
      responses:
        "201":
          description: The new key, shown exactly once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewApiKey"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /settings/reverse-proxy:
    get:
      operationId: getReverseProxy
      summary: Reverse-proxy login settings
      tags: [settings]
      responses:
        "200":
          description: The settings and the untrusted sightings recorded so far.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReverseProxy"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: putReverseProxy
      summary: Change reverse-proxy login settings
      description: |
        Off by default. When enabled, a non-empty `header` from a trusted proxy address logs the
        admin in for that request. The same header from any other address is ignored and
        recorded under `untrusted`. `409 conflict` while the Config File declares `reverse_proxy`.
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReverseProxySettings"
      responses:
        "200":
          description: The settings as saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReverseProxy"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /settings:
    get:
      operationId: getSettings
      summary: App settings
      description: |
        The settings sections that exist so far: `language_region` and `root_folders`. Sections never
        saved report their defaults (English, US); `GET /setup` says which
        were saved. Reverse-proxy login settings have their own endpoint.
      tags: [settings]
      responses:
        "200":
          description: Every section.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: patchSettings
      summary: Change settings
      description: |
        A JSON merge patch over the sections: send only what changes. Changing `primary_language`
        re-points the eight Profiles to their backing TRaSH profiles and, unless the same patch
        names `release_date_country`, moves the country to the new language's default. It also
        re-scores every stored file under the new Profiles, in the same step; files are not renamed
        and nothing is searched. A patch that names a section the Config File declares
        (`language_region`, `root_folders`, `check_github_updates`) answers `409 conflict` and saves
        nothing, not even its other sections.
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsPatch"
      responses:
        "200":
          description: Every section as saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /profiles:
    get:
      operationId: listProfiles
      summary: The eight Profiles
      description: In display order. Profiles are named by `key`, never by id.
      tags: [profiles]
      responses:
        "200":
          description: The Profiles with their settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileList"
        default:
          $ref: "#/components/responses/Problem"
  /profiles/{key}:
    parameters:
      - $ref: "#/components/parameters/ProfileKey"
    patch:
      operationId: patchProfile
      summary: Change a Profile's settings
      description: |
        A Slot has at most one default Profile per kind: making one the default replaces the old.
        The Standard Slot always keeps exactly one default per kind, so unsetting or disabling it is a
        `validation` error until another Standard Profile is the default. Disabling a Profile clears its defaults, and
        a disabled Profile cannot be made a default. `original_language` other than `reject` (or
        `original_fallback: true`) is a `validation` error on Original-Language Profiles, and so is an
        `original_fallback` that disagrees with `original_language` in the same patch.
        `409 conflict` while the Config File declares `profiles`.
      tags: [profiles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfilePatch"
      responses:
        "200":
          description: The Profile as saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /lookup:
    get:
      operationId: lookup
      summary: Search the metadata provider for Titles to add
      description: |
        One TMDB search across both kinds, in English, newest relevance first. Results already in the
        Library carry their Title id in `in_library`. A Series needs a TheTVDB id (from TMDB's external
        ids, else a TheTVDB remote-id search by IMDb id); one without is `addable: false` with
        `not_addable_reason: not_on_tvdb`, and `POST /titles` refuses it.
        `502 upstream_unavailable` means TMDB could not be reached or refused the key.
      tags: [titles]
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TitleKind"
      responses:
        "200":
          description: The matches.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LookupList"
        "422":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /lookup/{kind}/{tmdb_id}:
    parameters:
      - name: kind
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/TitleKind"
      - name: tmdb_id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: lookupTitle
      summary: One search result with the add panel's suggested Slots and Profiles
      description: |
        The Slots to preselect when adding it: every Slot with a default Profile for the kind, resolved
        by Profile resolution. Each Slot says why (`reason`) and carries a display `label`, the
        Profile's name. Requests use the same logic.
        It reads TMDB only. A Series' overview (status, network, air dates and seasons) comes from
        TheTVDB through `GET /lookup/series/{tmdb_id}/overview`, so the panel can open before TheTVDB
        answers and a TheTVDB failure affects only the overview.
      tags: [titles]
      responses:
        "200":
          description: The Title and the suggestion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LookupDetail"
        "404":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /lookup/series/{tmdb_id}/overview:
    parameters:
      - name: tmdb_id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: lookupSeriesOverview
      summary: A search result's Series overview, from TheTVDB
      description: |
        The add panel's Series overview: whether it is running or ended, its network, its first and
        last air dates and every season with its episode count and air dates. It reads TMDB and
        TheTVDB, so it can take longer than `GET /lookup/{kind}/{tmdb_id}`; the add panel loads it
        on its own. `404 not_found` when TMDB has no such Series, `404 not_on_tvdb` when TheTVDB does
        not have it (it cannot be added either), `502` when a provider fails.
      tags: [titles]
      responses:
        "200":
          description: The overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LookupSeries"
        "404":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /titles:
    get:
      operationId: listTitles
      summary: The Library's Titles as compact rows
      description: |
        Newest first. The SPA loads the whole Library once with `limit=10000` and filters locally.
        `q` matches titles and aliases, ignoring case.
      tags: [titles]
      parameters:
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/TitleKind"
        - name: q
          in: query
          schema:
            type: string
        - name: wanted
          in: query
          description: "`true` keeps the Titles with a Wanted Version (the Library's Wanted filter)."
          schema:
            type: boolean
        - name: long_missing
          in: query
          description: "`true` keeps the Titles with a Long Missing Version (the Long Missing chip)."
          schema:
            type: boolean
        - name: sort
          in: query
          description: |
            `added_at` (default) is newest first. `wanted_since` puts the Titles that have been Wanted
            longest first, and the ones that are not Wanted last.
          schema:
            type: string
            enum: [added_at, wanted_since]
            default: added_at
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 100
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: A page of rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleList"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createTitle
      summary: Add a Title to the Library
      description: |
        Fetches the Title from the metadata provider and adds it with the named Versions, each Wanted.
        `root_folder` must be one of the configured Root folders for the kind; left out, it is the
        kind's first.
        `409 conflict` when the Title is already in the Library (the existing id is in
        `detail`). A Series takes `series_monitor` (default `all`) and, to start with only some seasons
        monitored, `seasons`.
        A `422` names the field and code: `body` / `required` (no body), `versions` / `required`
        (no Version), `versions[i].slot` / `invalid` (not a Slot) or `duplicate` (a Slot twice),
        `versions[i].profile` / `not_found`, `disabled` or `wrong_slot`, `root_folder` / `not_found`
        (not one of the kind's Root folders) or `required` (none configured), `series_monitor` /
        `invalid`, `seasons` / `invalid` (a negative season), `unknown` (a season the Series does
        not have) or `not_a_series` (seasons for a Movie), and `tmdb_id` / `not_on_tvdb` (a Series
        TheTVDB does not have).
      tags: [titles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TitleCreate"
      responses:
        "201":
          description: The new Title.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleDetail"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /titles/bulk:
    post:
      operationId: bulkTitles
      summary: Change many Titles at once
      description: |
        Applies one `action` to every Title in `title_ids`, with the action's parameters next to it,
        and answers per Title: `changed`, `skipped` with a `reason` (such as `unchanged` when the
        Title already is as asked, or `not_found`), or `failed` with a `reason` saying why. A
        repeated id counts once. Running the same call again changes nothing more: each Title is
        then skipped, with the reason that fits the action (see below).

        - `monitor` sets `monitored` on Movies, as `PATCH /titles/{id}` does. A Series follows the
          same rule through its monitoring mode: `monitored: false` sets `series_monitor: none` and
          unmonitors every episode, so an unmonitored Series behaves like an unmonitored Movie;
          `monitored: true` applies `series_monitor`. Left out, a Series already monitored keeps
          its mode and an unmonitored one gets `all`. Again: `unchanged`.
        - `switch_profile` moves each Title's Version in `slot` to `profile`, as
          `PATCH /versions/{id}` does: the file is re-scored and the Version searched. A Title with no
          Version in that Slot is skipped as `no_version`. Again: `unchanged`.
        - `add_version` adds a Version in `slot` under `profile`, as `POST /titles/{id}/versions`
          does. A Title whose Slot already holds a Version is skipped as `slot_taken`. Again:
          `slot_taken`.
        - `remove_version` removes each Title's Version in `slot`, as `DELETE /versions/{id}` does;
          files stay on disk unless `delete_files` is true. No Version there: skipped as `no_version`.
          Again: `no_version`.
        - `search` makes every Wanted Version of the Titles due a search now and starts the sweep,
          as "Search all Wanted" does for the whole Library; the indexers' daily budgets apply. A
          Title with nothing Wanted is skipped as `nothing_wanted`. It acts on every call.
        - `refresh` starts a metadata refresh of each Title, as `POST /titles/{id}/refresh` does. A
          Title with `metadata_frozen` is skipped as `frozen`. It acts on every call.
        - `freeze` sets `metadata_frozen` to `frozen`, as `PATCH /titles/{id}` does. Again:
          `unchanged`.
        - `remove` removes the Titles from the Library, as `DELETE /titles/{id}` does; files stay on
          disk unless `delete_files` is true. Again: `not_found`.

        A wrong or disabled Profile for the Slot, or a `series_monitor` that contradicts
        `monitored`, refuses the whole call with 422.
      tags: [titles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TitlesBulk"
      responses:
        "200":
          description: What happened to each Title, in the order of `title_ids`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitlesBulkResult"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /titles/{id}/refresh:
    parameters:
      - $ref: "#/components/parameters/TitleId"
    post:
      operationId: refreshTitle
      summary: Refresh a Title's metadata now
      description: |
        Starts a refresh from the metadata providers and returns at once; the Title changes when it
        finishes (a `title` hint arrives on the stream). A changed English title or year renames the
        Title's folder and files. A Title with `metadata_frozen` is left as it is.
      tags: [titles]
      responses:
        "202":
          description: The refresh was started.
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /titles/{id}:
    parameters:
      - $ref: "#/components/parameters/TitleId"
    get:
      operationId: getTitle
      summary: One Title with its Versions
      tags: [titles]
      responses:
        "200":
          description: The Title.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleDetail"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: patchTitle
      summary: Change a Title's settings
      description: |
        `monitored` monitors or unmonitors a Movie; `422` for a Series, which uses `series_monitor`.
        An unmonitored Movie is never Wanted, searched or Upgraded, by the sweep or RSS; its Versions
        and files stay as they are, and a Grab started by hand still works. Monitoring it again makes
        its Versions due a search now. `series_monitor` applies the mode to every episode and season
        now (Specials are never monitored by a mode); `422` for a Movie. `metadata_frozen` true keeps
        the stored metadata as it is and clears a "Title gone upstream" row; false lets refreshes
        resume.

        `root_folder` moves the Title to another of its kind's Root folders: its folder moves there
        under the same name in one directory rename, taking every Version's files and subtitles,
        and the Title's `root_folder` and file paths change with it. A Title with no folder on disk
        only has its `root_folder` changed; its current Root folder changes nothing. Media servers
        are told about both folders and the log records a `move` event. Refusals change nothing:
        `422` `root_folder` / `not_found` when it isn't one of the kind's Root folders, `422`
        `root_folder` / `other_filesystem` when it is on another filesystem (Kestrel never copies a
        Title across mounts), `409` `folder_taken` when a folder of that name is already in the
        target, `409` `import_running` while an Import into the Title is running (try again after
        it).
      tags: [titles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TitlePatch"
      responses:
        "200":
          description: The Title.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleDetail"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteTitle
      summary: Remove a Title with all its Versions
      description: |
        Removes the Title and what Kestrel holds of it. Files stay on disk unless `delete_files` is
        true, which also removes the Title's folder if it is then empty. Active downloads of the
        Title are canceled.
      tags: [titles]
      parameters:
        - $ref: "#/components/parameters/DeleteFiles"
      responses:
        "204":
          description: Removed.
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /titles/{id}/versions:
    parameters:
      - $ref: "#/components/parameters/TitleId"
    post:
      operationId: addVersion
      summary: Add a Version to an empty Slot
      description: |
        Adds a Wanted Version under an enabled Profile of the Slot and searches it at once.
        `409` when the Slot already holds a Version.
      tags: [titles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionRef"
      responses:
        "201":
          description: The new Version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionDetail"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /versions/{id}:
    parameters:
      - $ref: "#/components/parameters/VersionId"
    patch:
      operationId: patchVersion
      summary: Switch a Version's Profile
      description: |
        Moves the Version to another enabled Profile of its Slot (HD to Any, say). The file is
        re-scored under the new Profile from what was stored at Import: no re-parse, no new ffprobe,
        no rename. A file the new Profile no longer accepts by resolution class or language is a
        `misfit`: the Version becomes Wanted and any fitting Release replaces the file whatever its
        Score. The Version is searched at once.
      tags: [titles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionPatch"
      responses:
        "200":
          description: The Version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionDetail"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteVersion
      summary: Remove a Version
      description: |
        Removes the Version. Its files stay on disk unless `delete_files` is true. An active download
        for it is canceled.
      tags: [titles]
      parameters:
        - $ref: "#/components/parameters/DeleteFiles"
      responses:
        "204":
          description: Removed.
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /versions/{id}/files:
    parameters:
      - $ref: "#/components/parameters/VersionId"
    delete:
      operationId: deleteVersionFiles
      summary: Delete a Version's files and keep the Version
      description: |
        Deletes files of the Version from disk, with their text subtitles, and keeps the Version and
        its monitoring: a monitored Movie or episode whose file goes is Wanted again. A Movie loses its
        file. A Series loses the files holding the episodes in scope: `season` narrows to one season,
        `episode_ids` to those episodes (within `season` when both are given); neither deletes every
        file of the Version. A file holding several episodes (a season pack, a double episode) is
        deleted whole, so every episode it holds loses its file, also those outside the scope.
        A file that cannot be deleted from disk stays the Version's (its Release is not blocklisted)
        and is listed in `not_deleted` with the reason; the others go all the same.
        With `blocklist` each file's Release goes on the Blocklist, so it is not grabbed again; a file
        Kestrel did not grab (an adopted one) cannot be, and says so in `blocklisted`, as does one
        whose Release could not be blocklisted: the file is deleted all the same.
        A `delete` event in the Log names the files and the Releases blocklisted. It waits for an
        Import into the Title to finish.
        A `season` the Series lacks (a negative one included), or an episode that is not the Series'
        (or not of `season`), is a `422` naming that field (`season` or `episode_ids`) with the code
        `unknown`; on a Movie either is a `422` with the code `not_a_series`. There are no other
        `422` codes.
      tags: [titles]
      parameters:
        - name: season
          in: query
          description: Only the files holding episodes of this season (0 is Specials).
          schema:
            type: integer
        - name: episode_ids
          in: query
          description: Only the files holding these episodes.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: integer
              format: int64
        - name: blocklist
          in: query
          description: Also put each deleted file's Release on the Blocklist. Off by default.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: What was deleted; no files when the scope held none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedFiles"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /titles/{id}/episodes:
    parameters:
      - $ref: "#/components/parameters/TitleId"
    get:
      operationId: listEpisodes
      summary: A Series' episodes with one cell per Version, for the heat map
      description: In aired order, Specials first. `404` for a Movie.
      tags: [titles]
      responses:
        "200":
          description: The episodes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodeList"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /titles/{id}/episodes/monitor:
    parameters:
      - $ref: "#/components/parameters/TitleId"
    post:
      operationId: monitorEpisodes
      summary: Monitor or unmonitor episodes
      description: Every id must be an episode of this Series, else `404` and nothing changes. Seasons follow their episodes.
      tags: [titles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EpisodesMonitor"
      responses:
        "204":
          description: Done.
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /titles/{id}/seasons/{season}:
    parameters:
      - $ref: "#/components/parameters/TitleId"
      - name: season
        in: path
        required: true
        schema:
          type: integer
          minimum: 0
    patch:
      operationId: patchSeason
      summary: Monitor or unmonitor a season and all its episodes
      tags: [titles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeasonPatch"
      responses:
        "204":
          description: Done.
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /titles/{id}/poster:
    parameters:
      - $ref: "#/components/parameters/TitleId"
    get:
      operationId: getTitlePoster
      summary: The Title's poster
      description: Served from the poster cache under the config dir, fetched on first use. `404` when the provider has none.
      tags: [titles]
      responses:
        "200":
          description: A JPEG.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /versions/{id}/releases:
    parameters:
      - $ref: "#/components/parameters/VersionId"
    post:
      operationId: searchVersionReleases
      summary: Manual search for a Version
      description: |
        Asks every enabled indexer in parallel, parses and evaluates every Release against the
        Version's Profile and answers with all of them, acceptable ones first, then by `score`.
        Synchronous, with a server timeout of about 30 s: an indexer that has not answered by then
        is reported in `indexer_errors` and the rest still come back. The Releases stay grabbable
        for 6 h through their `release_id`. `fits` says whether the Release belongs to this Version's
        Slot; a Release for another Slot carries the `other_slot` rejection. A Series Version is
        searched by `season` and `episode_ids` in the body (none searches the whole Series); the
        Releases are single or multi-episode ones and season packs, told apart by `episodes` and `pack`.
        A Release naming an episode TheTVDB does not list yet is grabbable as a Placeholder Episode
        when its season is listed and monitored and the episode is at most 2 past the season's last
        listed one; otherwise it carries `episode_not_listed` (overridable), or `season_not_listed`
        when TheTVDB lists no such season.
      tags: [grabs]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseSearch"
      responses:
        "200":
          description: The Releases.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseList"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /versions/{id}/search:
    parameters:
      - $ref: "#/components/parameters/VersionId"
    post:
      operationId: searchVersion
      summary: Search now for a Version
      description: |
        The automatic search for what the Version is missing, started by hand and run at once in the
        background: it grabs the best Release as the sweep would. Unlike the sweep it is not held back
        by the 80 % daily search budget stop; indexer pauses, backoff and Pause Grabs still apply.
        Only Wanted Movies and episodes without an active Grab are searched. A Series Version is
        searched once per season with a Wanted episode, narrowed by `season` and `episode_ids` in the
        body (none searches the whole Series; `episode_ids` may span seasons). A Movie ignores both.
        The answer comes at once; when the search is done, a `search` event in the Log says what it
        grabbed, and Grabs record their own events.
        A `season` the Series lacks (a negative one included), or an episode that is not the Series'
        (or not of `season`), is a `422` naming that field (`season` or `episode_ids`) with the code
        `unknown`. There are no other `422` codes.
      tags: [grabs]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseSearch"
      responses:
        "202":
          description: The search started.
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /versions/{id}/original-offer/accept:
    parameters:
      - $ref: "#/components/parameters/VersionId"
    post:
      operationId: acceptOriginalOffer
      summary: Accept a Version's Original Offer
      description: |
        Grabs every Release the offer lists, the same as "Grab anyway": exactly the Releases offered,
        however old the offer is, a dismissed one included. A Release that cannot be grabbed counts in
        `failed`: one the indexer no longer has, or the Blocklist holds, has its offer dropped; one that
        failed for another reason (the download client is down, a spent budget) stays offered. When none
        could be grabbed the first failure answers as `createGrab` would. No offer is `404`.
        Once imported, the file fills the Version, and any acceptable Release replaces it whatever its
        Score.
      tags: [grabs]
      responses:
        "201":
          description: The Grabs made.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferAccepted"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /versions/{id}/original-offer/dismiss:
    parameters:
      - $ref: "#/components/parameters/VersionId"
    post:
      operationId: dismissOriginalOffer
      summary: Dismiss a Version's Original Offer
      description: |
        Keeps waiting for a Primary-Language Release for the units the offer shows (a Movie's one, a
        Series' episodes). Dismissal is per unit: a unit stays dismissed until a Release that scores
        higher for it is offered, and a unit offered for the first time, such as a new episode, shows the
        offer again with the units not dismissed alone. No offer is `404`.
      tags: [grabs]
      responses:
        "204":
          description: The offer is dismissed.
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /grabs:
    post:
      operationId: createGrab
      summary: Grab a Release into the download client
      description: |
        Fetches the Release's NZB from its indexer and sends it to the download client's category for
        the Title's kind. The Grab starts at `sent`, keyed by the client's id. `release_id` comes from
        a search in the last 6 h, otherwise `409 release_expired` (also when the indexer no longer has
        the NZB). A Release with rejections needs `override: true` ("Grab anyway"), else `422 rejected`;
        `blocklisted`, `other_slot` and `season_not_listed` can never be overridden and answer
        `422 not_overridable`. A Series Release naming episodes TheTVDB does not list yet adds them as
        Placeholder Episodes, which the Grab covers.
        A spent grab budget is `429 rate_limited`; an unreachable client or indexer is
        `502 upstream_unavailable`.
      tags: [grabs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrabCreate"
      responses:
        "201":
          description: The new Grab.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Grab"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /grabs/{id}:
    parameters:
      - $ref: "#/components/parameters/GrabId"
    get:
      operationId: getGrab
      summary: One Grab
      tags: [grabs]
      responses:
        "200":
          description: The Grab.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Grab"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /grabs/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/GrabId"
    post:
      operationId: cancelGrab
      summary: Cancel a Grab
      description: |
        Removes the job (and its files) from the download client and drops the Grab; the Version is
        Wanted again. With `blocklist: true` ("Cancel and blocklist") the Release also goes on the
        Blocklist and the Version is searched again at once for the next best Release. A client that
        cannot be reached is `502 upstream_unavailable` and nothing changes.
      tags: [grabs]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrabCancel"
      responses:
        "204":
          description: The Grab is gone.
        "404":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /grabs/{id}/retry-import:
    parameters:
      - $ref: "#/components/parameters/GrabId"
    post:
      operationId: retryGrabImport
      summary: Retry a stalled Import now
      description: |
        A stalled Import (the environment is at fault: disk full, a folder not writable) retries
        on its own after 1, 5, 15 and 60 minutes, then hourly. This skips the wait and imports at
        once. `404` for a Grab whose Import is not stalled.
      tags: [grabs]
      responses:
        "204":
          description: The Import is due now.
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /grabs/{id}/discard:
    parameters:
      - $ref: "#/components/parameters/GrabId"
    post:
      operationId: discardGrab
      summary: Discard a stalled Import
      description: |
        Gives up on a stalled Import: the Grab fails as `discarded` (no Blocklist entry), the job
        and its files leave the download client and the Version is Wanted again. `404` for a Grab
        whose Import is not stalled; a client that cannot be reached is `502 upstream_unavailable`.
      tags: [grabs]
      responses:
        "204":
          description: The Grab is discarded.
        "404":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /stalled-imports/retry:
    post:
      operationId: retryStalledImports
      summary: Retry stalled Imports now
      description: |
        "Retry all" of Needs attention: every stalled Import with the `reason`, or all of them
        without one, is due at once.
      tags: [grabs]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StalledImportsSelect"
      responses:
        "204":
          description: The Imports are due now.
        default:
          $ref: "#/components/responses/Problem"
  /stalled-imports/discard:
    post:
      operationId: discardStalledImports
      summary: Discard stalled Imports
      description: |
        "Discard all" of Needs attention: every stalled Import with the `reason`, or all of them
        without one, is discarded as `POST /grabs/{id}/discard` does.
      tags: [grabs]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StalledImportsSelect"
      responses:
        "204":
          description: The Imports are discarded.
        "502":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /queue:
    get:
      operationId: listQueue
      summary: Downloading now
      description: |
        Every Grab that is sent, downloading or finished and waiting for its Import, oldest first.
        Progress comes from the download client's last poll (every 10 s while anything downloads);
        before the first poll after a start `bytes_left` is 0 and `eta` is null.
      tags: [grabs]
      responses:
        "200":
          description: The active Grabs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueList"
        default:
          $ref: "#/components/responses/Problem"
  /upcoming:
    get:
      operationId: listUpcoming
      summary: Upcoming
      description: |
        The agenda for a window of days (both ends included; default today to 30 days on, in UTC).
        Monitored episodes airing in the window, and for each monitored Movie with an unfilled Version
        its theatrical, digital and physical dates in the release-date country (falling back to the
        US, then the earliest anywhere) that lie in the window. A Movie that cannot be searched yet
        says from when it can (`searchable_from`). Oldest day first (Settled 18).
      tags: [titles]
      parameters:
        - name: from
          in: query
          description: First day of the window. Default today.
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Last day of the window. Default 30 days after `from`.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The agenda.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpcomingList"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /recent:
    get:
      operationId: listRecentlyAdded
      summary: Recently added
      description: |
        The ten most recent Imports, newest first. An Import of several files at once (a season pack)
        is one row with `files` set to how many it brought.
      tags: [titles]
      responses:
        "200":
          description: The recent Imports.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecentList"
        default:
          $ref: "#/components/responses/Problem"
  /events:
    get:
      operationId: listEvents
      summary: The Log
      description: |
        Events newest first. Routine events (a download started or finished, an Adoption scan) are
        left out unless `routine=true`; they are pruned after 30 days, the rest are kept forever.
        `kind` is a growing set: clients show kinds they do not know. `slot` matches events about a
        Version in that Slot. `before` pages: pass the smallest `id` seen.
      tags: [system]
      parameters:
        - { name: kind, in: query, schema: { type: string } }
        - { name: title_id, in: query, schema: { type: integer, format: int64 } }
        - { name: slot, in: query, schema: { $ref: "#/components/schemas/Slot" } }
        - { name: routine, in: query, schema: { type: boolean, default: false } }
        - { name: before, in: query, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 200 } }
      responses:
        "200":
          description: The events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
        default:
          $ref: "#/components/responses/Problem"
  /blocklist:
    get:
      operationId: listBlocklist
      summary: The Blocklist
      description: Releases never to be grabbed again, newest first. `title_id` narrows it to one Title.
      tags: [grabs]
      parameters:
        - { name: title_id, in: query, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: The entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlocklistList"
        default:
          $ref: "#/components/responses/Problem"
  /blocklist/{id}:
    parameters:
      - $ref: "#/components/parameters/GrabId"
    delete:
      operationId: deleteBlocklistEntry
      summary: Remove a Blocklist entry
      description: The Release can be grabbed again. An entry that is already gone is `404`.
      tags: [grabs]
      responses:
        "204":
          description: The entry is gone.
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /adoption:
    get:
      operationId: getAdoption
      summary: The Adoption scan and plan
      description: |
        Adoption takes over an existing on-disk library without downloading it again. There is at most one
        plan, stored until it is committed or discarded: `idle` (no plan), `scanning` (building one in the
        background, with `progress`), `planned` (waiting for review) or `committing`. `revision` changes with
        every edit of the plan; `POST /adoption/commit` must name the one it reviewed.
      tags: [adoption]
      responses:
        "200":
          description: The Adoption state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Adoption"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: discardAdoption
      summary: Throw the plan away
      description: Nothing was written to disk or the Library by a plan, so this only forgets it. `409 conflict` while committing.
      tags: [adoption]
      responses:
        "204":
          description: The plan is gone.
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /adoption/scan:
    post:
      operationId: scanAdoption
      summary: Scan the Root folders for files to adopt
      description: |
        Starts a background scan (manual only) and answers `202` with `Location: /adoption`. A new scan
        replaces the stored plan. Each top-level entry of a Root folder is one Title candidate; tracked
        Titles' folders are scanned too, for files no Version holds. `409 conflict` while a scan or a
        commit is running.
      tags: [adoption]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                root_folders:
                  type: array
                  nullable: true
                  description: Limit the scan to these configured Root folders; `null` or absent scans them all.
                  items:
                    type: string
      responses:
        "202":
          description: The scan started.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Adoption"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /adoption/rows:
    get:
      operationId: listAdoptionRows
      summary: The rows of the plan
      description: |
        Rows are grouped Matched, Needs choice and Skipped. `duplicate` keeps rows with a file left in place
        because another file holds its Slot; `replacement` keeps rows that would replace a file a Version
        holds (unticked by default).
      tags: [adoption]
      parameters:
        - name: filter
          in: query
          required: false
          schema:
            type: string
            enum: [needs_choice, matched, duplicate, replacement, skipped]
      responses:
        "200":
          description: The rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdoptionRowList"
        default:
          $ref: "#/components/responses/Problem"
  /adoption/rows/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    patch:
      operationId: patchAdoptionRow
      summary: Tick a row or settle its match
      description: |
        `ticked` includes or leaves out the whole row, `files` the single files in it. `tmdb_id` settles a
        Needs choice row (from its candidates or a search) or corrects a match: the row is planned again
        against that Movie. Unsettled Needs choice rows are left out of the commit. Every change moves the plan's `revision`.
      tags: [adoption]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdoptionRowPatch"
      responses:
        "200":
          description: The row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdoptionRow"
  /attention:
    get:
      operationId: getAttention
      summary: Needs attention
      description: |
        The problems the admin can act on. Blocking rows first, then Warnings newest first. Rows come
        from conditions that clear themselves when the condition goes (Settled 16, 17; #17); `actions`
        are built by the server and drawn generically by the SPA. An action with method `GET` opens
        that SPA path (such as `/settings/download-client`) instead of calling the API. `count`
        counts `rows` only: the Long Missing group has its own `long_missing` and the Originals
        available group its own `originals`, and neither counts.
      tags: [system]
      responses:
        "200":
          description: The rows that need attention.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attention"
        default:
          $ref: "#/components/responses/Problem"
  /attention/{id}/dismiss:
    parameters:
      - $ref: "#/components/parameters/AttentionRowId"
    post:
      operationId: dismissAttention
      summary: Dismiss a one-off health warning
      description: |
        Hides the row until its condition recurs. Only rows with a `dismiss` action can be dismissed;
        any other row is `409 conflict`, and one that is already gone `404`.
      tags: [system]
      responses:
        "204":
          description: The row is hidden.
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /adoption/commit:
    post:
      operationId: commitAdoption
      summary: Adopt the ticked rows
      description: |
        Answers `202`; the work runs in the background, one transaction per Title. Files are renamed in
        place into the naming scheme together with their sidecar subtitles, and each Title is logged as it is
        adopted. `409 conflict` when `revision` is not the plan's current one (a row changed since it was
        reviewed) or the plan is not `planned`. The plan is cleared once committed.
      tags: [adoption]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision:
                  type: integer
                  format: int64
      responses:
        "202":
          description: The commit started.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Adoption"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /cleanup/preview:
    post:
      operationId: previewCleanup
      summary: List the Unmanaged files Clean up could delete
      description: |
        Lists the Unmanaged files inside tracked Titles' folders by category: junk, samples, orphaned
        subtitles and empty folders (ticked by default as safe), then subtitles in other languages, local
        artwork, extras and unmanaged videos (unticked). Files any Version holds are never listed. Without
        `title_ids` every tracked Title's folder is covered. The answer names a `preview_id` that
        `POST /cleanup/run` deletes from; nothing is deleted here.
      tags: [cleanup]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title_ids:
                  type: array
                  items:
                    type: integer
                    format: int64
      responses:
        "200":
          description: The categories with their files.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CleanupPreview"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /cleanup/run:
    post:
      operationId: runCleanup
      summary: Delete the ticked categories of a preview
      description: |
        Permanently deletes the files of the named categories that the preview listed, except those named
        in `exclude`, and removes the folders they leave empty. Files that a Version holds by now are
        skipped. Each cleaned Title is logged. `404 not_found` when the preview is unknown or expired.
      tags: [cleanup]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preview_id, categories]
              properties:
                preview_id:
                  type: string
                categories:
                  type: array
                  items:
                    $ref: "#/components/schemas/CleanupCategoryKey"
                exclude:
                  type: array
                  description: Paths to leave alone although their category is ticked.
                  items:
                    type: string
      responses:
        "202":
          description: What the run deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CleanupResult"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /wanted/search:
    post:
      operationId: searchAllWanted
      summary: Search all Wanted
      description: |
        Makes every Wanted Version due a search now and wakes the sweep, so they are searched in the
        next minute or so rather than on their own cadence (the indexers' budgets still apply).
        Filled Versions are not touched: there is no "search all Upgrades". The answer is how many
        Versions were queued.
      tags: [titles]
      responses:
        "202":
          description: The Wanted Versions are queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WantedSearch"
        default:
          $ref: "#/components/responses/Problem"
  /system/status:
    get:
      operationId: getSystemStatus
      summary: The health strip
      description: |
        Capacity at a glance: the download client, each indexer with its daily budget and any pause, the
        free space on the data mount and every Root folder, the active TRaSH snapshot with its commit
        date, and whether "Pause Grabs" is on.
      tags: [system]
      responses:
        "200":
          description: The current status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        default:
          $ref: "#/components/responses/Problem"
  /about:
    get:
      operationId: getAbout
      summary: About Kestrel
      description: |
        The running version and licence, what the daily GitHub check found (an `update` is present
        only when a newer release exists and the "Check GitHub for updates" switch is on), and the
        TRaSH commit whose Custom Formats score Releases now. Attribution and shortcuts are static
        text in the SPA; the full third-party notices are `GET /about/notices`.
      tags: [system]
      responses:
        "200":
          description: The About data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/About"
        default:
          $ref: "#/components/responses/Problem"
  /about/notices:
    get:
      operationId: getNotices
      summary: Third-party notices
      description: |
        The generated notices (Markdown as plain text): the ported Radarr and Sonarr code, TRaSH data
        and the Go and npm dependencies with their licences. The same file ships in the image and with
        every release as `THIRD_PARTY_NOTICES.md`.
      tags: [system]
      responses:
        "200":
          description: The notices.
          content:
            text/plain:
              schema:
                type: string
  /trash/update:
    post:
      operationId: updateTrash
      summary: Update from TRaSH
      description: |
        Fetches TRaSH's newest Custom Formats and profiles now, whatever the daily check's switch says.
        The load is all-or-nothing: the snapshot must parse and every stored file is re-scored under it
        before it becomes active. A snapshot that fails either is rejected whole (`422 validation`), the
        previous one stays in use and the "TRaSH update rejected" Warning is raised. Nothing is renamed
        or searched. When TRaSH cannot be reached it is `502 upstream_unavailable`.
      tags: [system]
      responses:
        "200":
          description: Done; `changed` is false when TRaSH had nothing newer.
          content:
            application/json:
              schema:
                type: object
                required: [changed, commit]
                properties:
                  changed:
                    type: boolean
                  commit:
                    type: string
        default:
          $ref: "#/components/responses/Problem"
  /stream:
    get:
      operationId: stream
      summary: Live state as Server-Sent Events
      description: |
        One long-lived `text/event-stream`. Frames are `event: <type>` plus one `data:` line of JSON:

        - `changed`: a hint, `{resource, id}` (see `ChangedHint`). Refetch that resource over REST.
          They come from the events log, so an Import landing in a background loop reaches an open
          tab within about a second, and from handlers for changes made through this API.
        - `queue`: the `QueueList` snapshot (same as `GET /queue`), on connect and whenever it changes.
        - `activity`: the loops running now (`ActivitySnapshot`), on connect and whenever it changes.
        - `attention`: the Needs attention count and worst severity (`AttentionSnapshot`), on connect
          and whenever it changes.

        A comment line (`: heartbeat`) every 15 s keeps proxies from closing the connection.
        There is no replay: after a reconnect the client refetches whatever it shows, and every
        streamed state also has a snapshot resource. Unauthenticated callers get `401` instead of a
        stream. Clients using an API key read it with streaming `fetch`; `EventSource` cannot set headers.
      tags: [system]
      responses:
        "200":
          description: The event stream.
          headers:
            X-Accel-Buffering:
              schema:
                type: string
                enum: ["no"]
          content:
            text/event-stream:
              schema:
                type: string
  /requests:
    post:
      operationId: createRequest
      summary: Ask Kestrel for a Title in one or more Slots
      description: |
        The native, source-neutral Request API (ADR 0004); Silo's router plugin calls it. A Request is
        accepted at once, with no approval step. It adds the Title or only its missing Versions, searches
        them at once, and never changes an existing Version: a Slot that already has a Version is accepted
        unchanged and reports that Version's Profile and status. A Slot named without a `profile` uses
        Profile resolution. A new Title goes in the `root_folder` named, else the first Root folder of its kind; an existing Title is never moved. A Series Request names `seasons`, or `null` for the whole Series; it only ever adds monitoring.

        `201` for a new Request, accepted or rejected (`outcome`, `reject_reason`); a Request Kestrel cannot
        serve (`not_on_tvdb`, `unknown_title`, `no_enabled_profile`) is stored as rejected and changes nothing.
        A retry of the same `(source, source_request_id)` creates nothing and returns the stored Request
        with `200`. `422` for a malformed body or a `root_folder` that is not one of the kind's Root folders. The requester's email is never stored.
      tags: [requests]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestCreate"
      responses:
        "200":
          description: A retry, so the Request stored earlier, with its current status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Request"
        "201":
          description: The new Request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Request"
        "422":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    get:
      operationId: listRequests
      summary: Requests, newest first, or the named ones
      description: |
        `id` may repeat (at most 100) to read those Requests in one call, as the Silo plugin does; the
        other filters and the cursor are ignored then.
      tags: [requests]
      parameters:
        - name: source
          in: query
          schema:
            type: string
        - name: title_id
          in: query
          schema:
            type: integer
            format: int64
        - name: id
          in: query
          schema:
            type: array
            maxItems: 100
            items:
              type: integer
              format: int64
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: A page of Requests with their current status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestList"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /requests/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: getRequest
      summary: One Request with its current per-Slot status
      tags: [requests]
      responses:
        "200":
          description: The Request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Request"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /plugins:
    get:
      operationId: listPlugins
      summary: The built-in plugins and their config schemas
      description: |
        One manifest per compiled-in plugin, any contract. The UI draws each plugin's form from
        `fields`, so a new adapter needs no UI change.
      tags: [plugins]
      responses:
        "200":
          description: Every plugin manifest, ordered by contract then id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginList"
        default:
          $ref: "#/components/responses/Problem"
  /plugins/{plugin_id}/options/{field}:
    post:
      operationId: listPluginOptions
      summary: Live choices for a config field
      description: |
        Asks the plugin for the current values of a `live` field (SABnzbd's categories) using the
        form as it stands. `config` is merged over the stored instance when `instance_id` is given,
        so a saved secret need not be sent again. The config is not validated as a whole, because the
        form may be half filled. A plugin failure is `502 upstream_unavailable`.
      tags: [plugins]
      parameters:
        - $ref: "#/components/parameters/PluginId"
        - name: field
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PluginForm"
      responses:
        "200":
          description: The choices.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginOptionList"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /plugin-instances:
    get:
      operationId: listPluginInstances
      summary: Configured plugin instances
      tags: [plugins]
      responses:
        "200":
          description: Every instance of every contract. Secrets are never included.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginInstanceList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createPluginInstance
      summary: Configure a plugin instance
      description: |
        Absent config fields take the manifest default. Secret fields are accepted here and never
        returned: `secrets_set` lists which are set. Enabling an instance beyond its contract's cap
        (one enabled download client in v1) is a `validation` error on `enabled`. A name the Config
        File declares answers `409 conflict`; instances created here may share names with each other.
      tags: [plugins]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PluginInstanceCreate"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginInstance"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /plugin-instances/test:
    post:
      operationId: testPluginConfig
      summary: Test an unsaved plugin config
      description: |
        Runs the plugin's live test with the given config. A failing test is still `200` with
        `ok: false` and the plugin's error `code`; only a malformed config is `422`.
      tags: [plugins]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PluginTestRequest"
      responses:
        "200":
          description: The test outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginTestResult"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /plugin-instances/{id}:
    parameters:
      - $ref: "#/components/parameters/InstanceId"
    get:
      operationId: getPluginInstance
      summary: One plugin instance
      tags: [plugins]
      responses:
        "200":
          description: The instance. Secrets are never included.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginInstance"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updatePluginInstance
      summary: Change a plugin instance
      description: |
        `config` merges key by key. A secret that is omitted stays as it is, a string replaces it
        and `null` clears it; clearing any other field returns it to its default. `409 conflict` for
        an instance the Config File declares (`from_config_file`), or a rename to a declared name.
      tags: [plugins]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PluginInstancePatch"
      responses:
        "200":
          description: The updated instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginInstance"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deletePluginInstance
      summary: Remove a plugin instance
      description: "`409 conflict` for an instance the Config File declares (`from_config_file`)."
      tags: [plugins]
      responses:
        "204":
          description: Removed.
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /plugin-instances/{id}/test:
    parameters:
      - $ref: "#/components/parameters/InstanceId"
    post:
      operationId: testPluginInstance
      summary: Test a saved plugin instance
      description: |
        Like the unsaved test, with the stored config (secrets included) underneath the optional
        `config` edits, so a form can be tested before it is saved without retyping the secret.
      tags: [plugins]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                config:
                  $ref: "#/components/schemas/PluginConfigPatch"
      responses:
        "200":
          description: The test outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginTestResult"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
components:
  parameters:
    AttentionRowId:
      name: id
      in: path
      required: true
      description: A row's `id` from `GET /attention`.
      schema:
        type: string
    PluginId:
      name: plugin_id
      in: path
      required: true
      schema:
        type: string
    InstanceId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    DeleteFiles:
      name: delete_files
      in: query
      description: Also delete the files from disk. Off by default.
      schema:
        type: boolean
        default: false
    TitleId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    VersionId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    GrabId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ProfileKey:
      name: key
      in: path
      required: true
      schema:
        type: string
        enum: [hd-primary, hd-original, any-primary, any-original, 4k-primary, 4k-original]
  headers:
    SetCookie:
      description: The `kestrel_session` cookie (HttpOnly, SameSite=Lax, Path from KESTREL_BASE_URL).
      schema:
        type: string
  responses:
    Problem:
      description: An error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    System:
      type: object
      required: [version, api_major, base_url]
      properties:
        version:
          type: string
          description: Kestrel release version, or `dev` for local builds.
          example: 0.1.0
        api_major:
          type: integer
          description: Major version of this API (the `N` in `/api/vN`).
          example: 1
        base_url:
          type: string
          description: The routing prefix from KESTREL_BASE_URL, empty when unset.
          example: /kestrel
    ApiKeyInfo:
      type: object
      required: [prefix, created_at, from_environment]
      properties:
        prefix:
          type: string
          nullable: true
          description: The first characters of the key, for recognising it.
          example: kst_ABCD
        created_at:
          type: string
          format: date-time
          nullable: true
        from_environment:
          type: boolean
          description: |
            `true` while the key comes from `KESTREL_API_KEY`, which replaces any generated key and
            stops it from being rotated here.
    NewApiKey:
      type: object
      required: [key]
      properties:
        key:
          type: string
          description: The whole key, `kst_` plus 52 base32 characters.
    ReverseProxySettings:
      type: object
      required: [enabled, trusted_proxies, header]
      properties:
        enabled:
          type: boolean
        trusted_proxies:
          type: array
          description: Addresses or CIDR ranges of the proxies whose header is believed.
          items:
            type: string
          example: ["172.18.0.0/16", "10.0.0.5"]
        header:
          type: string
          description: The header carrying the user name.
          example: Remote-User
    ReverseProxy:
      allOf:
        - $ref: "#/components/schemas/ReverseProxySettings"
        - type: object
          required: [untrusted, from_config_file]
          properties:
            from_config_file:
              type: boolean
              description: "`true` while the Config File declares `reverse_proxy`, which can't be changed here then."
            untrusted:
              type: array
              readOnly: true
              description: Addresses that sent the header without being trusted, newest first.
              items:
                $ref: "#/components/schemas/UntrustedProxyHeader"
    UntrustedProxyHeader:
      type: object
      required: [ip, value, count, last_seen]
      properties:
        ip:
          type: string
        value:
          type: string
          description: The header value from the latest request.
        count:
          type: integer
        last_seen:
          type: string
          format: date-time
    Credentials:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 8
    Me:
      type: object
      required: [username, method, proxy_user, from_config_file]
      properties:
        username:
          type: string
        from_config_file:
          type: boolean
          description: "`true` while the Config File declares the account, whose password can't be changed here then."
        method:
          type: string
          enum: [session, proxy, api_key]
          description: How this request was authenticated.
        proxy_user:
          type: string
          nullable: true
          description: The reverse-proxy header value, when `method` is `proxy`.
    Setup:
      type: object
      required: [account_exists, completed, sections]
      properties:
        account_exists:
          type: boolean
        completed:
          type: boolean
        sections:
          type: object
          required: [account, language, download_client, indexer, root_folders, profiles]
          properties:
            account:
              $ref: "#/components/schemas/SetupSectionState"
            language:
              $ref: "#/components/schemas/SetupSectionState"
            download_client:
              $ref: "#/components/schemas/SetupSectionState"
            indexer:
              $ref: "#/components/schemas/SetupSectionState"
            root_folders:
              $ref: "#/components/schemas/SetupSectionState"
            profiles:
              $ref: "#/components/schemas/SetupSectionState"
    PrimaryLanguage:
      type: string
      description: The household's Primary Language as ISO 639-1.
      enum: [en, de, fr]
    Settings:
      type: object
      required: [language_region, root_folders, check_github_updates, trash, metadata, pause_grabs, from_config_file]
      properties:
        pause_grabs:
          type: boolean
          description: |
            "Pause Grabs" (default off). On, no automatic Grab is made: the sweep, RSS, the search on
            add and the retry after a failed download still search and score Releases, so Wanted and
            Upgrade candidates still show up, but send nothing to the download client. A Grab started
            by hand from a Version's Releases still goes through. Turning it off makes every Wanted
            Version, and every Upgrade search made while paused, due a search now, so the next sweep
            grabs as usual. The health strip shows it as
            `grabs_paused`.
        from_config_file:
          type: object
          required: [language_region, root_folders, check_github_updates]
          description: |
            Per section, `true` while the Config File declares it. A declared section can't be
            changed here: a patch naming it answers `409 conflict`.
          properties:
            language_region:
              type: boolean
            root_folders:
              type: boolean
            check_github_updates:
              type: boolean
        metadata:
          type: object
          required: [tmdb_api_key_set, tvdb_api_key_set]
          description: |
            The provider keys the UI overrides, by precedence UI override, then `KESTREL_TMDB_API_KEY` /
            `KESTREL_TVDB_API_KEY`, then the key embedded in the build. The keys are secrets: only whether an override is set is reported.
          properties:
            tmdb_api_key_set:
              type: boolean
            tvdb_api_key_set:
              type: boolean
        trash:
          type: object
          required: [auto_update]
          properties:
            auto_update:
              type: boolean
              description: Check TRaSH daily and take its newest Custom Formats and profiles. On by default (and only while "Check GitHub for updates" is on).
        check_github_updates:
          type: boolean
          description: |
            "Check GitHub for updates" (default on). Once a day Kestrel asks GitHub for the latest release
            and the published security advisories (and, with the TRaSH update, the latest TRaSH commit).
            Off means no request to GitHub at all, except a manual "Update from TRaSH".
        root_folders:
          $ref: "#/components/schemas/RootFolders"
        language_region:
          type: object
          required: [primary_language, release_date_country]
          properties:
            primary_language:
              $ref: "#/components/schemas/PrimaryLanguage"
            release_date_country:
              type: string
              description: ISO 3166-1 alpha-2. "Released" follows it.
              example: DE
    RootFolders:
      type: object
      required: [movies, series]
      description: |
        Where Imports put Titles, one or more absolute paths per kind. The first is the default when
        adding a Title. Unsaved, they report `<data dir>/media/movies` and `<data dir>/media/tv`.
      properties:
        movies:
          type: array
          minItems: 1
          items:
            type: string
        series:
          type: array
          minItems: 1
          items:
            type: string
    SettingsPatch:
      type: object
      properties:
        pause_grabs:
          type: boolean
        check_github_updates:
          type: boolean
        metadata:
          type: object
          description: A key that is omitted stays; an empty string clears the override so the next source applies.
          properties:
            tmdb_api_key:
              type: string
              writeOnly: true
            tvdb_api_key:
              type: string
              writeOnly: true
        trash:
          type: object
          properties:
            auto_update:
              type: boolean
        root_folders:
          type: object
          description: |
            Replaces the named lists. Each path must exist, be a directory and be writable
            (`not_found`, `not_directory`, `not_writable`, `not_absolute`, `required`).
          properties:
            movies:
              type: array
              items:
                type: string
            series:
              type: array
              items:
                type: string
        language_region:
          type: object
          properties:
            primary_language:
              $ref: "#/components/schemas/PrimaryLanguage"
            release_date_country:
              type: string
    Slot:
      type: string
      enum: [standard, 4k]
    Profile:
      type: object
      required: [key, name, slot, language_rule, original_language, original_fallback, enabled, default_movies, default_series, min_height, max_height, trash_profile_movies, trash_profile_series, from_config_file]
      properties:
        from_config_file:
          type: boolean
          description: "`true` while the Config File declares `profiles`, which declares every Profile at once."
        key:
          type: string
          example: hd-primary
        name:
          type: string
          example: HD
        slot:
          $ref: "#/components/schemas/Slot"
        language_rule:
          type: string
          description: Which audio the Profile requires.
          enum: [primary, original]
        original_language:
          $ref: "#/components/schemas/OriginalLanguageChoice"
        original_fallback:
          type: boolean
          deprecated: true
          description: |
            Deprecated in favour of `original_language`: `true` exactly when it is `accept`. Always
            false on Original-Language Profiles.
        enabled:
          type: boolean
        default_movies:
          type: boolean
        default_series:
          type: boolean
        min_height:
          type: integer
        max_height:
          type: integer
        trash_profile_movies:
          type: string
          description: The TRaSH profile file (without .json) backing the Profile for Movies under the current Primary Language.
        trash_profile_series:
          type: string
          description: The same for Series.
    ProfileList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Profile"
    ProfilePatch:
      type: object
      properties:
        enabled:
          type: boolean
        original_language:
          $ref: "#/components/schemas/OriginalLanguageChoice"
        original_fallback:
          type: boolean
          deprecated: true
          description: Deprecated in favour of `original_language`; `true` sets `accept`, `false` sets `reject`.
        default_movies:
          type: boolean
        default_series:
          type: boolean
    OriginalLanguageChoice:
      type: string
      enum: [reject, offer, accept]
      description: |
        What a Primary-Language Profile does with a Release that has the Title's Original Language but
        no Primary-Language audio: `reject` it, `offer` it to the admin as an Original Offer (Needs
        attention, never grabbed on its own), or `accept` it like any other. Always `reject` on
        Original-Language Profiles.
    SetupSectionState:
      type: string
      enum: [done, todo]
    PluginConfigPatch:
      type: object
      description: |
        Plugin settings by manifest field key. Secret fields are write-only: they are accepted
        here and never returned. In a patch, `null` clears a field.
      additionalProperties: true
    PluginOption:
      type: object
      required: [value, label]
      properties:
        value:
          type: string
        label:
          type: string
    PluginField:
      type: object
      required: [key, label, type, required, default, help, options, live]
      properties:
        key:
          type: string
        label:
          type: string
        type:
          type: string
          enum: [text, url, secret, int, bool, select]
        required:
          type: boolean
        default:
          nullable: true
          description: The value used when the field is absent, or `null`.
        help:
          type: string
        options:
          type: array
          description: The fixed choices of a `select` field.
          items:
            $ref: "#/components/schemas/PluginOption"
        live:
          type: boolean
          description: |
            Choices come from `POST /plugins/{plugin_id}/options/{field}` once the connection works.
            Until then the field is free text.
    PluginManifest:
      type: object
      required: [id, name, contract, version, capabilities, fields]
      properties:
        id:
          type: string
          example: sabnzbd
        name:
          type: string
        contract:
          type: string
          description: The versioned plugin contract, e.g. `download_client.v1`.
          example: download_client.v1
        version:
          type: string
        capabilities:
          type: object
          description: "Contract-specific facts, e.g. protocols: [usenet]."
          additionalProperties:
            type: array
            items:
              type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/PluginField"
    PluginList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PluginManifest"
        next_cursor:
          type: string
          nullable: true
    PluginOptionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PluginOption"
    PluginForm:
      type: object
      required: [config]
      properties:
        config:
          $ref: "#/components/schemas/PluginConfigPatch"
        instance_id:
          type: integer
          format: int64
          nullable: true
          description: A saved instance whose stored config, secrets included, lies under `config`.
    PluginInstance:
      type: object
      required: [id, contract, plugin_id, name, enabled, priority, config, secrets_set, from_config_file]
      properties:
        from_config_file:
          type: boolean
          description: |
            `true` for an instance the Config File declares. It can't be changed or removed here,
            and its name can't be given to another instance.
        id:
          type: integer
          format: int64
        contract:
          type: string
        plugin_id:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        priority:
          type: integer
        config:
          type: object
          description: Every non-secret manifest field, `null` for none.
          additionalProperties: true
        secrets_set:
          type: array
          description: Keys of the secret fields that have a value. The values are never returned.
          items:
            type: string
    PluginInstanceList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PluginInstance"
        next_cursor:
          type: string
          nullable: true
    PluginInstanceCreate:
      type: object
      required: [plugin_id, name, config]
      properties:
        plugin_id:
          type: string
        name:
          type: string
          minLength: 1
        enabled:
          type: boolean
          description: Defaults to true when absent.
        priority:
          type: integer
          description: Defaults to 0 when absent.
        config:
          $ref: "#/components/schemas/PluginConfigPatch"
    PluginInstancePatch:
      type: object
      properties:
        name:
          type: string
        enabled:
          type: boolean
        priority:
          type: integer
        config:
          $ref: "#/components/schemas/PluginConfigPatch"
    PluginTestRequest:
      type: object
      required: [plugin_id, config]
      properties:
        plugin_id:
          type: string
        config:
          $ref: "#/components/schemas/PluginConfigPatch"
    PluginTestResult:
      type: object
      required: [ok, code, message]
      properties:
        ok:
          type: boolean
        code:
          type: string
          nullable: true
          description: |
            Why the test failed, `null` when it passed: `auth`, `unavailable`, `rate_limited`,
            `invalid` or `not_found`. Clients tolerate new values.
        message:
          type: string
    TitleKind:
      type: string
      enum: [movie, series]
    SlotState:
      type: string
      description: |
        `wanted` (monitored, released, no file), `filled`, `downloading`, `unmonitored` or `unreleased`.
        Clients tolerate new values.
      enum: [wanted, filled, downloading, unmonitored, unreleased]
    LookupResult:
      type: object
      required: [kind, tmdb_id, tvdb_id, title, year, poster, in_library, addable, not_addable_reason, ratings]
      properties:
        kind:
          $ref: "#/components/schemas/TitleKind"
        tmdb_id:
          type: integer
        tvdb_id:
          type: integer
          nullable: true
        title:
          type: string
        year:
          type: integer
          nullable: true
        poster:
          type: string
          nullable: true
          description: A small TMDB poster URL.
        in_library:
          type: integer
          format: int64
          nullable: true
          description: The Title id when it is already in the Library.
        addable:
          type: boolean
        not_addable_reason:
          type: string
          nullable: true
          description: "`not_on_tvdb` for a Series TheTVDB does not have; `null` when addable. Clients tolerate new values."
        ratings:
          type: array
          description: Audience ratings of the Title from ratings sources; empty when none has one.
          items:
            $ref: "#/components/schemas/Rating"
    LookupList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LookupResult"
        next_cursor:
          type: string
          nullable: true
    SuggestedSlot:
      type: object
      required: [slot, profile, label, reason]
      properties:
        slot:
          $ref: "#/components/schemas/Slot"
        profile:
          type: string
          description: The Profile key.
          example: any-primary
        label:
          type: string
          example: Any
        reason:
          type: string
          description: "`default` (the Slot's default Profile). Clients tolerate new values."
          enum: [default]
    LookupDetail:
      type: object
      required: [kind, tmdb_id, title, year, overview, in_library, certification, certification_country, slots, ratings, poster, runtime, genres]
      properties:
        kind:
          $ref: "#/components/schemas/TitleKind"
        tmdb_id:
          type: integer
        title:
          type: string
        year:
          type: integer
          nullable: true
        overview:
          type: string
        in_library:
          type: integer
          format: int64
          nullable: true
        certification:
          type: string
          nullable: true
          description: The Title's rating, as TMDB writes it ("6", "PG").
        certification_country:
          type: string
          nullable: true
          description: The country that rating is from; the release-date country unless TMDB had none there.
        slots:
          type: array
          description: Every Slot with a default Profile for the kind, in Slot order.
          items:
            $ref: "#/components/schemas/SuggestedSlot"
        ratings:
          type: array
          description: Audience ratings of the Title from ratings sources; empty when none has one.
          items:
            $ref: "#/components/schemas/Rating"
        poster:
          type: string
          nullable: true
          description: A TMDB poster URL, larger than the search result's.
        runtime:
          type: integer
          nullable: true
          description: Minutes; a typical episode's for a Series.
        genres:
          type: array
          description: TMDB's genre names, in TMDB's order.
          items:
            type: string
          example: [Drama, Crime]
    LookupSeries:
      type: object
      description: |
        A Series' overview for the add panel (`GET /lookup/series/{tmdb_id}/overview`): status,
        network, air dates and seasons.
      required: [status, network, first_aired, last_aired, latest_season, seasons]
      properties:
        status:
          type: string
          nullable: true
          description: "`continuing`, `ended` or `upcoming`, as TheTVDB says. Clients tolerate new values."
          example: ended
        network:
          type: string
          nullable: true
          description: The network it first aired on, from TMDB.
          example: AMC
        first_aired:
          type: string
          format: date
          nullable: true
          description: The first episode's air date, Specials aside.
        last_aired:
          type: string
          format: date
          nullable: true
          description: The latest air date up to today, Specials aside.
        latest_season:
          type: integer
          nullable: true
          description: |
            The latest season that has aired or is airing (Specials aside); `null` when none has
            started. What `TitleCreate.seasons` takes to add only the current season.
        seasons:
          type: array
          description: Every season TheTVDB lists, Specials (0) first.
          items:
            $ref: "#/components/schemas/LookupSeason"
    LookupSeason:
      type: object
      required: [number, episodes, first_aired, last_aired]
      properties:
        number:
          type: integer
          description: 0 is Specials.
        episodes:
          type: integer
        first_aired:
          type: string
          format: date
          nullable: true
          description: The season's earliest known air date.
        last_aired:
          type: string
          format: date
          nullable: true
          description: The season's latest known air date, which may be in the future.
    VersionRef:
      type: object
      required: [slot, profile]
      properties:
        slot:
          $ref: "#/components/schemas/Slot"
        profile:
          type: string
          description: The Profile key. It must be an enabled Profile of that Slot.
    VersionPatch:
      type: object
      required: [profile]
      properties:
        profile:
          type: string
          description: The Profile key. It must be an enabled Profile of the Version's Slot.
    TitleCreate:
      type: object
      required: [kind, tmdb_id, versions]
      properties:
        kind:
          $ref: "#/components/schemas/TitleKind"
        tmdb_id:
          type: integer
        versions:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/VersionRef"
        root_folder:
          type: string
          nullable: true
        series_monitor:
          allOf:
            - $ref: "#/components/schemas/SeriesMonitor"
          nullable: true
          description: Series only; defaults to `all`.
        seasons:
          type: array
          nullable: true
          description: |
            Series only: the seasons monitored when it is added, Specials (0) included when named.
            Left out, `series_monitor` decides every episode. Given, it decides seasons that have
            not started airing and every episode that arrives later; the seasons not named are
            left unmonitored. A season the Series does not have is a `422` (`seasons` /
            `unknown`), as is a negative one (`seasons` / `invalid`) and a Movie with seasons
            (`seasons` / `not_a_series`).
          items:
            type: integer
          example: [1]
    SeriesMonitor:
      type: string
      description: |
        `all` monitors every episode, future ones and new seasons included; `future` the episodes airing
        today or later or without an air date, and new seasons; `none` nothing. Specials (season 0) are
        never monitored automatically.
      enum: [all, future, none]
    Season:
      type: object
      required: [number, monitored]
      properties:
        number:
          type: integer
          description: 0 is Specials.
        monitored:
          type: boolean
    EpisodeCell:
      type: object
      required: [state, score, file]
      properties:
        state:
          $ref: "#/components/schemas/SlotState"
        score:
          type: integer
          nullable: true
          description: The Score of the file holding the episode, when there is one.
        file:
          allOf:
            - $ref: "#/components/schemas/EpisodeFile"
          nullable: true
          description: The file holding the episode in this Version, even a misfit one; `null` when there is none.
    EpisodeFile:
      type: object
      description: A file on disk holding one or more episodes of a Version (a multi-episode file holds several).
      required: [id, path, size, quality, episode_ids]
      properties:
        id:
          type: integer
          format: int64
        path:
          type: string
        size:
          type: integer
          format: int64
        quality:
          type: string
          nullable: true
          description: The quality name parsed from the release name ("WEBDL-1080p").
        episode_ids:
          type: array
          description: Every episode the file holds, in aired order; more than one for a multi-episode file.
          items:
            type: integer
            format: int64
    Episode:
      type: object
      required: [id, season, number, name, primary_name, original_name, air_date, monitored, cells, placeholder]
      properties:
        id:
          type: integer
          format: int64
        season:
          type: integer
        number:
          type: integer
        name:
          type: string
          description: The original title; kept for older clients, the same as `original_name`.
        air_date:
          type: string
          format: date
          nullable: true
          description: The TheTVDB air date.
        monitored:
          type: boolean
        cells:
          type: object
          description: One cell per Slot, `null` where the Title has no Version.
          required: [standard, 4k]
          properties:
            standard:
              allOf:
                - $ref: "#/components/schemas/EpisodeCell"
              nullable: true
            4k:
              allOf:
                - $ref: "#/components/schemas/EpisodeCell"
              nullable: true
        primary_name:
          type: string
          description: The title in the Primary Language, from TheTVDB; the original title when TheTVDB has no translation. Empty for a Placeholder Episode.
        original_name:
          type: string
          description: The title in the Series' original language. Empty for a Placeholder Episode.
        placeholder:
          type: boolean
          description: |
            True for a Placeholder Episode: one Kestrel added because a Release named it before
            TheTVDB listed it. It has no name, air date or TheTVDB id until a metadata refresh adopts
            it, and counts as released from when it was added.
    EpisodeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Episode"
    TitlePatch:
      type: object
      description: Merge patch. Only Movies take `monitored`, only Series have a `series_monitor`.
      properties:
        monitored:
          type: boolean
          description: A Movie only; a Series is monitored through `series_monitor`.
        series_monitor:
          $ref: "#/components/schemas/SeriesMonitor"
        metadata_frozen:
          type: boolean
        root_folder:
          type: string
          description: One of the Root folders of the Title's kind to move the Title to.
    TitlesBulk:
      description: |
        One action over many Titles. `action` says which, and picks the parameters that go with it.
      oneOf:
        - $ref: "#/components/schemas/TitlesBulkMonitor"
        - $ref: "#/components/schemas/TitlesBulkSwitchProfile"
        - $ref: "#/components/schemas/TitlesBulkAddVersion"
        - $ref: "#/components/schemas/TitlesBulkRemoveVersion"
        - $ref: "#/components/schemas/TitlesBulkSearch"
        - $ref: "#/components/schemas/TitlesBulkRefresh"
        - $ref: "#/components/schemas/TitlesBulkFreeze"
        - $ref: "#/components/schemas/TitlesBulkRemove"
      discriminator:
        propertyName: action
        mapping:
          monitor: "#/components/schemas/TitlesBulkMonitor"
          switch_profile: "#/components/schemas/TitlesBulkSwitchProfile"
          add_version: "#/components/schemas/TitlesBulkAddVersion"
          remove_version: "#/components/schemas/TitlesBulkRemoveVersion"
          search: "#/components/schemas/TitlesBulkSearch"
          refresh: "#/components/schemas/TitlesBulkRefresh"
          freeze: "#/components/schemas/TitlesBulkFreeze"
          remove: "#/components/schemas/TitlesBulkRemove"
    TitleIds:
      type: array
      minItems: 1
      maxItems: 10000
      items:
        type: integer
        format: int64
    TitlesBulkMonitor:
      type: object
      required: [action, title_ids, monitored]
      properties:
        action:
          type: string
          enum: [monitor]
        title_ids:
          $ref: "#/components/schemas/TitleIds"
        monitored:
          type: boolean
        series_monitor:
          allOf:
            - $ref: "#/components/schemas/SeriesMonitor"
          description: |
            The mode monitored Series get. Left out, a Series already monitored keeps its mode and
            an unmonitored one gets `all`. With `monitored: true` it cannot be `none`, and with
            `monitored: false` it can only be `none`.
    TitlesBulkSwitchProfile:
      type: object
      required: [action, title_ids, slot, profile]
      properties:
        action:
          type: string
          enum: [switch_profile]
        title_ids:
          $ref: "#/components/schemas/TitleIds"
        slot:
          $ref: "#/components/schemas/Slot"
        profile:
          type: string
          description: The Profile key. It must be an enabled Profile of that Slot.
    TitlesBulkAddVersion:
      type: object
      required: [action, title_ids, slot, profile]
      properties:
        action:
          type: string
          enum: [add_version]
        title_ids:
          $ref: "#/components/schemas/TitleIds"
        slot:
          $ref: "#/components/schemas/Slot"
        profile:
          type: string
          description: The Profile key. It must be an enabled Profile of that Slot.
    TitlesBulkRemoveVersion:
      type: object
      required: [action, title_ids, slot]
      properties:
        action:
          type: string
          enum: [remove_version]
        title_ids:
          $ref: "#/components/schemas/TitleIds"
        slot:
          $ref: "#/components/schemas/Slot"
        delete_files:
          type: boolean
          default: false
          description: Delete the files from disk too.
    TitlesBulkSearch:
      type: object
      required: [action, title_ids]
      properties:
        action:
          type: string
          enum: [search]
        title_ids:
          $ref: "#/components/schemas/TitleIds"
    TitlesBulkRefresh:
      type: object
      required: [action, title_ids]
      properties:
        action:
          type: string
          enum: [refresh]
        title_ids:
          $ref: "#/components/schemas/TitleIds"
    TitlesBulkFreeze:
      type: object
      required: [action, title_ids, frozen]
      properties:
        action:
          type: string
          enum: [freeze]
        title_ids:
          $ref: "#/components/schemas/TitleIds"
        frozen:
          type: boolean
    TitlesBulkRemove:
      type: object
      required: [action, title_ids]
      properties:
        action:
          type: string
          enum: [remove]
        title_ids:
          $ref: "#/components/schemas/TitleIds"
        delete_files:
          type: boolean
          default: false
          description: Delete the files from disk too.
    TitlesBulkResult:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TitleBulkOutcome"
    TitleBulkOutcome:
      type: object
      required: [title_id, outcome, reason, message]
      properties:
        title_id:
          type: integer
          format: int64
        outcome:
          type: string
          enum: [changed, skipped, failed]
        reason:
          type: string
          nullable: true
          enum: [unchanged, not_found, no_version, slot_taken, nothing_wanted, frozen, download_client, internal]
          description: |
            Why the Title was skipped or failed, `null` when it changed. Skipped: `unchanged`, it
            already is as asked; `not_found`, there is no such Title; `no_version`, it has no Version
            in the Slot; `slot_taken`, the Slot already holds a Version; `nothing_wanted`, none of its
            Versions is Wanted; `frozen`, its metadata is frozen. Failed: `download_client`, the
            download client could not cancel the Title's download (`message` has what it said);
            `internal`, an unexpected error, which the log has.
        message:
          type: string
          nullable: true
          description: The reason in a sentence.
    SeasonPatch:
      type: object
      required: [monitored]
      properties:
        monitored:
          type: boolean
    EpisodesMonitor:
      type: object
      required: [episode_ids, monitored]
      properties:
        episode_ids:
          type: array
          items:
            type: integer
            format: int64
        monitored:
          type: boolean
    SlotSummary:
      type: object
      required: [version_id, profile, state, long_missing]
      properties:
        version_id:
          type: integer
          format: int64
        profile:
          type: string
        state:
          $ref: "#/components/schemas/SlotState"
        long_missing:
          type: boolean
    TitleRow:
      type: object
      required: [id, kind, title, primary_title, year, slots, wanted_since, added_at, size]
      properties:
        id:
          type: integer
          format: int64
        kind:
          $ref: "#/components/schemas/TitleKind"
        title:
          type: string
          description: The English title.
        primary_title:
          type: string
          description: The title in the Primary Language; the English title when TMDB has no translation.
        year:
          type: integer
          nullable: true
        slots:
          type: object
          required: [standard, 4k]
          properties:
            standard:
              allOf:
                - $ref: "#/components/schemas/SlotSummary"
              nullable: true
            4k:
              allOf:
                - $ref: "#/components/schemas/SlotSummary"
              nullable: true
        wanted_since:
          type: string
          format: date-time
          nullable: true
        added_at:
          type: string
          format: date-time
        size:
          type: integer
          format: int64
          description: Bytes the files of its Versions take on disk, 0 when it holds none.
    TitleList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TitleRow"
        next_cursor:
          type: string
          nullable: true
    FileSummary:
      type: object
      required: [path, size, release_name, score, imported_at]
      properties:
        path:
          type: string
        size:
          type: integer
          format: int64
        release_name:
          type: string
        score:
          type: integer
          nullable: true
        quality:
          type: string
          nullable: true
          description: The quality name parsed from the release name ("Bluray-1080p").
        languages:
          type: array
          description: The audio languages ffprobe found (English names), in track order.
          items:
            type: string
        misfit:
          type: boolean
          description: The file no longer fits the Version's Profile; the Version is Wanted.
        imported_at:
          type: string
          format: date-time
    VersionDetail:
      type: object
      required: [id, slot, profile, state, long_missing, wanted_since, file, added_at]
      properties:
        id:
          type: integer
          format: int64
        slot:
          $ref: "#/components/schemas/Slot"
        profile:
          type: string
        state:
          $ref: "#/components/schemas/SlotState"
        long_missing:
          type: boolean
        wanted_since:
          type: string
          format: date-time
          nullable: true
        file:
          allOf:
            - $ref: "#/components/schemas/FileSummary"
          nullable: true
        added_at:
          type: string
          format: date-time
        coverage:
          $ref: "#/components/schemas/VersionCoverage"
        original_offer:
          description: The Version's Original Offer, dismissed or not; null or absent when it has none.
          allOf:
            - $ref: "#/components/schemas/OriginalOffer"
          nullable: true
    VersionCoverage:
      type: object
      description: |
        How far a Series Version is filled, in episodes and bytes; present only for a Series
        Version. It agrees with the Version's `state`: Wanted while `wanted` is above zero.
      required: [episodes, filled, wanted, long_missing, size]
      properties:
        episodes:
          type: integer
          description: |
            The episodes the Version counts: those it holds a file for and those it Wants. Unmonitored
            and unreleased episodes without a file are left out.
        filled:
          type: integer
          description: Episodes the Version holds a file for.
        wanted:
          type: integer
          description: Episodes that are Wanted.
        long_missing:
          type: integer
          description: The Wanted episodes that are Long Missing.
        size:
          type: integer
          format: int64
          description: Bytes of all the Version's files.
    DeletedFiles:
      type: object
      required: [files, not_deleted]
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/DeletedFile"
        not_deleted:
          type: array
          description: |
            The files in scope that could not be deleted from disk (a read-only disk, missing
            permissions). They stay the Version's; nothing else about them changed.
          items:
            $ref: "#/components/schemas/NotDeletedFile"
    DeletedFile:
      type: object
      required: [path, size, release_name, episode_ids, blocklisted]
      properties:
        path:
          type: string
        size:
          type: integer
          format: int64
        release_name:
          type: string
        episode_ids:
          type: array
          description: Every episode that lost its file, in aired order; empty for a Movie.
          items:
            type: integer
            format: int64
        blocklisted:
          type: boolean
          description: The Release went on the Blocklist. False unless asked, for a file Kestrel did not grab and when blocklisting failed.
    NotDeletedFile:
      type: object
      required: [path, episode_ids, reason]
      properties:
        path:
          type: string
        episode_ids:
          type: array
          description: Every episode the file holds, in aired order; empty for a Movie.
          items:
            type: integer
            format: int64
        reason:
          type: string
          description: Why, as the filesystem said it, e.g. `permission denied`.
    ReleaseSearch:
      type: object
      description: |
        Narrows the search of a Series Version to a season and, within it, episodes. Movie searches
        take nothing.
      properties:
        season:
          type: integer
          nullable: true
        episode_ids:
          type: array
          items:
            type: integer
            format: int64
    RejectionCode:
      type: string
      description: |
        Why a Release cannot go to a Version. Clients tolerate codes they do not know. `original_only`
        is a Release with the Title's Original Language but no Primary-Language audio under a Profile
        that offers such Releases.
      enum: [below_min_score, resolution, quality, language, original_language_unknown, blocklisted, other_slot, episode_not_listed, season_not_listed, original_only]
    Rejection:
      type: object
      required: [code, message, overridable]
      properties:
        code:
          $ref: "#/components/schemas/RejectionCode"
        message:
          type: string
        overridable:
          type: boolean
          description: False for `blocklisted`, `other_slot` and `season_not_listed`, which "Grab anyway" never overrides.
    CustomFormatMatch:
      type: object
      required: [name, points]
      properties:
        name:
          type: string
        points:
          type: integer
    Release:
      type: object
      required: [release_id, name, indexer, size, published_at, quality, languages, custom_formats, score, fits, rejections]
      properties:
        release_id:
          type: string
          description: Opaque; names the Release for 6 h.
        name:
          type: string
        indexer:
          type: string
        size:
          type: integer
          format: int64
        published_at:
          type: string
          format: date-time
        quality:
          type: string
          example: Bluray-1080p
        languages:
          type: array
          items:
            type: string
        custom_formats:
          type: array
          items:
            $ref: "#/components/schemas/CustomFormatMatch"
        score:
          type: integer
        fits:
          type: string
          enum: [this_slot, other_slot, none]
        rejections:
          type: array
          items:
            $ref: "#/components/schemas/Rejection"
        season:
          type: integer
          description: Series only. The season of the Release (the first of a multi-season pack).
        episodes:
          type: array
          items:
            type: integer
          description: Series only. The episode numbers of a single or multi-episode Release; empty for a pack.
        pack:
          type: boolean
          description: Series only. True for a season pack.
    IndexerError:
      type: object
      required: [indexer_id, indexer, code, message, retry_after]
      properties:
        indexer_id:
          type: integer
          format: int64
          nullable: true
        indexer:
          type: string
        code:
          type: string
          description: The plugin error code (`auth`, `unavailable`, `rate_limited`, `invalid`, `not_found`).
        message:
          type: string
        retry_after:
          type: integer
          nullable: true
          description: Seconds, when the indexer said how long to wait.
    ReleaseList:
      type: object
      required: [items, indexer_errors]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Release"
        indexer_errors:
          type: array
          items:
            $ref: "#/components/schemas/IndexerError"
    GrabCreate:
      type: object
      required: [version_id, release_id]
      properties:
        version_id:
          type: integer
          format: int64
        release_id:
          type: string
        override:
          type: boolean
          default: false
    Grab:
      type: object
      required: [id, title_id, version_id, release_name, indexer, size, published_at, score, client_id, state, overridden, is_upgrade, created_at]
      properties:
        id:
          type: integer
          format: int64
        title_id:
          type: integer
          format: int64
          nullable: true
        version_id:
          type: integer
          format: int64
          nullable: true
        release_name:
          type: string
        indexer:
          type: string
        size:
          type: integer
          format: int64
        published_at:
          type: string
          format: date-time
        score:
          type: integer
        client_id:
          type: string
          description: The download client's id for the job (SABnzbd's nzo_id).
        state:
          type: string
          enum: [sent, downloading, completed, importing, imported, failed]
        overridden:
          type: boolean
          description: Grabbed despite rejections.
        is_upgrade:
          type: boolean
        created_at:
          type: string
          format: date-time
    GrabCancel:
      type: object
      properties:
        blocklist:
          type: boolean
          default: false
    Adoption:
      type: object
      required: [state, progress, summary, revision, error, scanned_at, result]
      properties:
        state:
          type: string
          enum: [idle, scanning, planned, committing]
        progress:
          type: object
          required: [done, total]
          properties:
            done:
              type: integer
            total:
              type: integer
        summary:
          type: object
          description: Row counts of the plan; all zero when there is none.
          required: [matched, needs_choice, skipped, duplicate, replacement]
          properties:
            matched:
              type: integer
            needs_choice:
              type: integer
            skipped:
              type: integer
            duplicate:
              type: integer
            replacement:
              type: integer
        revision:
          type: integer
          format: int64
        error:
          type: string
          nullable: true
          description: Why the last scan could not finish, if it could not.
        scanned_at:
          type: string
          format: date-time
          nullable: true
        result:
          type: object
          nullable: true
          description: What the last commit did; kept until the next scan.
          required: [adopted, failed, title_ids]
          properties:
            adopted:
              type: integer
            failed:
              type: integer
            title_ids:
              type: array
              description: The Titles the commit adopted.
              items:
                type: integer
                format: int64
    AdoptionCandidate:
      type: object
      required: [tmdb_id, title, year]
      properties:
        tmdb_id:
          type: integer
        title:
          type: string
        year:
          type: integer
          nullable: true
    AdoptionMatch:
      type: object
      required: [tmdb_id, title, year, title_id, source, folder]
      properties:
        tmdb_id:
          type: integer
        tvdb_id:
          type: integer
          nullable: true
          description: The TheTVDB id of a Series match; null for a Movie.
        title:
          type: string
        year:
          type: integer
          nullable: true
        title_id:
          type: integer
          format: int64
          nullable: true
          description: The tracked Title the files join; null when adopting creates the Title.
        source:
          type: string
          enum: [tag, name, chosen]
          description: ID tag, confident name match, or picked by the admin.
        folder:
          type: string
          description: The Title folder the files are renamed into.
    AdoptionSubtitle:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
        to:
          type: string
    AdoptionFile:
      type: object
      required: [path, to, size, slot, profile, score, action, held_score, ticked, left, episodes, subtitles]
      properties:
        episodes:
          type: array
          description: The episodes of a Series file (a multi-episode file names several); empty for a Movie file.
          items:
            type: object
            required: [season, number]
            properties:
              season:
                type: integer
              number:
                type: integer
        path:
          type: string
        to:
          type: string
          description: The path it gets in the naming scheme.
        size:
          type: integer
          format: int64
        slot:
          $ref: "#/components/schemas/Slot"
        profile:
          type: string
          description: Key of the Profile the Version has or gets.
        score:
          type: integer
        action:
          type: string
          enum: [create, fill, replace]
          description: Create the Version, fill an empty one, or replace the file a Version holds.
        held_score:
          type: integer
          nullable: true
          description: The Score of the file `replace` would replace.
        ticked:
          type: boolean
        left:
          type: string
          nullable: true
          enum: [duplicate, path_occupied, unmatched]
          description: Why the file stays untouched; null when it is adopted if ticked.
        subtitles:
          type: array
          items:
            $ref: "#/components/schemas/AdoptionSubtitle"
    AdoptionRow:
      type: object
      required: [id, kind, status, skip_reason, entry, ticked, match, candidates, files]
      properties:
        id:
          type: integer
          format: int64
        kind:
          $ref: "#/components/schemas/TitleKind"
        status:
          type: string
          enum: [matched, needs_choice, skipped]
        skip_reason:
          type: string
          nullable: true
          enum: [invalid, no_video, no_enabled_profile, not_on_tvdb]
        entry:
          type: string
          description: The folder or loose file in the Root folder.
        ticked:
          type: boolean
        match:
          allOf:
            - $ref: "#/components/schemas/AdoptionMatch"
          nullable: true
        candidates:
          type: array
          description: Likely Movies or Series for a Needs choice row.
          items:
            $ref: "#/components/schemas/AdoptionCandidate"
        files:
          type: array
          items:
            $ref: "#/components/schemas/AdoptionFile"
    AdoptionRowList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdoptionRow"
    AdoptionRowPatch:
      type: object
      properties:
        ticked:
          type: boolean
        tmdb_id:
          type: integer
        files:
          type: array
          items:
            type: object
            required: [path, ticked]
            properties:
              path:
                type: string
              ticked:
                type: boolean
    StalledImportsSelect:
      type: object
      properties:
        reason:
          type: string
          description: Only the Imports stalled for this reason; all of them when absent.
    ChangedHint:
      type: object
      required: [resource, id]
      description: |
        Something changed; refetch it. `resource` is `title` (a Title, its Versions and the
        Library list), `grab`, `queue` or `log`; more are added. `id` is null when the hint is about the
        whole resource. Clients ignore resources they do not know.
      properties:
        resource:
          type: string
        id:
          type: integer
          format: int64
          nullable: true
    ActivitySnapshot:
      type: object
      required: [running]
      properties:
        running:
          type: array
          description: Names of the background loops mid-pass right now.
          items:
            type: string
    AttentionSnapshot:
      type: object
      required: [count, severity]
      properties:
        count:
          type: integer
          description: How many Needs attention rows there are.
        severity:
          type: string
          nullable: true
          enum: [blocking, warning]
          description: The worst severity among them, null when there are none.
    Attention:
      type: object
      required: [count, severity, rows, long_missing, originals]
      properties:
        count:
          type: integer
          description: How many `rows` there are. Long Missing does not count.
        severity:
          type: string
          nullable: true
          enum: [blocking, warning]
          description: The worst severity among the rows, null when there are none.
        rows:
          type: array
          items:
            $ref: "#/components/schemas/AttentionRow"
        long_missing:
          $ref: "#/components/schemas/LongMissing"
        originals:
          $ref: "#/components/schemas/OriginalsAvailable"
    AttentionRow:
      type: object
      required: [id, severity, kind, subject, message, since, count, actions]
      properties:
        id:
          type: string
          description: Opaque and stable while the condition lasts.
        severity:
          type: string
          enum: [blocking, warning]
        kind:
          type: string
          description: |
            What sort of condition, such as `download_client_unreachable`, `no_indexer`,
            `root_folder_unavailable`, `metadata_provider_failing`, `indexer_failing`,
            `stalled_imports` (one row per stall reason),
            `low_disk_space`, `untrusted_proxy_header` or a one-off health warning (`exdev`,
            `refresh_failed`, `plex_no_section`). The set grows; clients tolerate unknown kinds.
        subject:
          $ref: "#/components/schemas/AttentionSubject"
        message:
          type: string
        since:
          type: string
          format: date-time
          description: When the condition first showed.
        count:
          type: integer
          description: How often it was raised since it first showed.
        actions:
          type: array
          items:
            $ref: "#/components/schemas/AttentionAction"
    AttentionSubject:
      type: object
      required: [title_id, version_id, grab_id, plugin_instance_id]
      properties:
        title_id:
          type: integer
          format: int64
          nullable: true
        version_id:
          type: integer
          format: int64
          nullable: true
        grab_id:
          type: integer
          format: int64
          nullable: true
        plugin_instance_id:
          type: integer
          format: int64
          nullable: true
    AttentionAction:
      type: object
      required: [key, label, method, path, body, confirm]
      properties:
        key:
          type: string
          description: "`dismiss`, `test`, `open`, `disable`, `retry` and so on."
        body:
          type: object
          nullable: true
          additionalProperties: true
          description: The JSON body to send with an API call, when it needs one.
        label:
          type: string
        method:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE]
          description: "`GET` opens `path` in the SPA; the others call the API."
        path:
          type: string
          description: |
            For an API call, relative to the API root (`/plugin-instances/3/test`); for `GET`, an SPA
            path (`/settings/download-client`).
        confirm:
          type: string
          nullable: true
          description: Ask this before running the action, when set.
    WantedSearch:
      type: object
      required: [versions]
      properties:
        versions:
          type: integer
          description: How many Wanted Versions were queued for a search.
    LongMissing:
      type: object
      required: [count, items]
      properties:
        count:
          type: integer
          description: How many Versions are Long Missing.
        items:
          type: array
          description: The five most recently released.
          items:
            type: object
            required: [title_id, title, version_id, slot, profile, wanted_since, last_failure]
            properties:
              title_id:
                type: integer
                format: int64
              title:
                type: string
              profile:
                type: string
                description: The key of the Version's Profile.
              version_id:
                type: integer
                format: int64
              slot:
                $ref: "#/components/schemas/Slot"
              wanted_since:
                type: string
                format: date-time
              last_failure:
                type: string
                nullable: true
    OriginalsAvailable:
      type: object
      description: The Originals available group of Needs attention, outside the rail badge.
      required: [count, items]
      properties:
        count:
          type: integer
          description: How many Versions have an Original Offer that is not dismissed.
        items:
          type: array
          description: Those offers, newest first.
          items:
            $ref: "#/components/schemas/OriginalOffer"
    OriginalOffer:
      type: object
      description: |
        Releases with the Title's Original Language but no Primary-Language audio, held back for one
        Version whose Profile offers them, for what it is missing. A Movie has one Release; a Series
        lists every episode or season pack that has one. The offer lasts while those units are Wanted
        with no active Grab: a Primary-Language Release that is grabbed makes it go.
      required: [title_id, title, version_id, slot, profile, release, score, releases, found_at, dismissed]
      properties:
        title_id:
          type: integer
          format: int64
        title:
          type: string
        version_id:
          type: integer
          format: int64
        slot:
          $ref: "#/components/schemas/Slot"
        profile:
          type: string
          description: The key of the Version's Profile.
        release:
          type: string
          description: The name of the best-scoring Release offered.
        score:
          type: integer
          description: Its Score under the Version's Profile.
        releases:
          type: array
          items:
            $ref: "#/components/schemas/OfferedRelease"
        found_at:
          type: string
          format: date-time
          description: When the newest of the Releases was offered.
        dismissed:
          type: boolean
          description: |
            Every unit of the offer is dismissed: the admin keeps waiting for a Primary-Language Release,
            and `releases` lists the dismissed ones. While any unit is not dismissed, this is false and
            `releases` lists those units alone, which is what Accept grabs.
    OfferedRelease:
      type: object
      required: [name, indexer, score, size, published_at, season, pack, episodes]
      properties:
        name:
          type: string
        indexer:
          type: string
        score:
          type: integer
        size:
          type: integer
          format: int64
        published_at:
          type: string
          format: date-time
        season:
          type: integer
          nullable: true
          description: The season of a Series Release; null for a Movie.
        pack:
          type: boolean
          description: A season pack.
        episodes:
          type: array
          description: The episode numbers it is offered for, in `season`; empty for a Movie.
          items:
            type: integer
    OfferAccepted:
      type: object
      required: [grabs, failed]
      properties:
        grabs:
          type: array
          items:
            $ref: "#/components/schemas/Grab"
        failed:
          type: integer
          description: |
            How many of the offered Releases could not be grabbed. One the indexer no longer has, or the
            Blocklist holds, leaves the offer; one that failed for another reason stays offered.
    SystemStatus:
      type: object
      required: [download_client, indexers, disks, trash, grabs_paused]
      properties:
        grabs_paused:
          type: boolean
          description: The "Pause Grabs" setting is on, so no automatic Grab is made.
        trash:
          type: object
          description: The active TRaSH snapshot.
          required: [commit, committed_at, checked_at, auto_update]
          properties:
            commit:
              type: string
            committed_at:
              type: string
              format: date-time
              nullable: true
              description: When that commit was made; its age is the snapshot's age.
            checked_at:
              type: string
              format: date-time
              nullable: true
              description: When TRaSH was last asked for something newer.
            auto_update:
              type: boolean
        download_client:
          $ref: "#/components/schemas/ClientStatus"
        indexers:
          type: array
          items:
            $ref: "#/components/schemas/IndexerStatus"
        disks:
          type: array
          description: The data mount first, then every Root folder.
          items:
            $ref: "#/components/schemas/DiskStatus"
        update:
          allOf:
            - $ref: "#/components/schemas/UpdateAvailable"
          nullable: true
          description: A newer release exists. Absent when up to date or when the update check is off.
    UpdateAvailable:
      type: object
      required: [version, url]
      properties:
        version:
          type: string
          example: 0.3.2
        url:
          type: string
          description: The release page.
    About:
      type: object
      required: [version, license, trash_commit, check_github_updates]
      properties:
        version:
          type: string
          description: The running version, `dev` for local builds, `edge` for main builds.
          example: 0.2.0
        license:
          type: string
          example: GPL-3.0-only
        trash_commit:
          type: string
          description: The TRaSH Guides commit of the data scoring Releases now.
        check_github_updates:
          type: boolean
        update:
          allOf:
            - $ref: "#/components/schemas/UpdateAvailable"
          nullable: true
        checked_at:
          type: string
          format: date-time
          nullable: true
          description: When the daily GitHub check last succeeded.
    ClientStatus:
      type: object
      required: [state, name, instance_id, message]
      properties:
        state:
          type: string
          enum: [ok, failing, none]
          description: "`none` when no download client is enabled."
        name:
          type: string
          nullable: true
        instance_id:
          type: integer
          format: int64
          nullable: true
        message:
          type: string
          nullable: true
          description: What the last failed call said.
    IndexerStatus:
      type: object
      required: [instance_id, name, state, message, search_used, search_max, grab_used, grab_max, search_paused_until, grabs_paused, grabs_paused_until]
      properties:
        instance_id:
          type: integer
          format: int64
        name:
          type: string
        state:
          type: string
          enum: [ok, failing, disabled]
        message:
          type: string
          nullable: true
        search_used:
          type: integer
          description: Search requests made today (the indexer's own count when it reports one).
        search_max:
          type: integer
          nullable: true
          description: |
            The daily search budget, from the indexer's `apilimits` or the instance's `api_requests_per_day`;
            null when neither is known. Sweeps stop at 80 % of it; RSS, Grabs and manual searches go on.
        grab_used:
          type: integer
          nullable: true
          description: Downloads used today, when the indexer reports its download quota.
        grab_max:
          type: integer
          nullable: true
        search_paused_until:
          type: string
          format: date-time
          nullable: true
          description: |
            Searches (RSS included) are paused until then because the indexer said its request limit
            (code 500) or a bare 429 was reached. Not a failure.
        grabs_paused:
          type: boolean
          description: Grabs are paused (code 501, a bare 429 or a spent download quota). Not a failure.
        grabs_paused_until:
          type: string
          format: date-time
          nullable: true
          description: When the pause ends; null for a spent download quota, which ends when the indexer says so.
    DiskStatus:
      type: object
      required: [path, free_bytes, total_bytes]
      properties:
        path:
          type: string
        free_bytes:
          type: integer
          format: int64
        total_bytes:
          type: integer
          format: int64
    EventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Event"
    Event:
      type: object
      required: [id, at, kind, routine, title_id, version_id, episode_id, grab_id, request_id, message, data]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        kind:
          type: string
          description: "A growing set: grab, grab_failed, grab_canceled, import, import_rejected, import_stalled, import_episode, blocklist, request, rename, move, delete, adoption, cleanup, health_raised, health_cleared, and the routine grab_downloading, grab_completed, adoption_scanned, title_refreshed, search, original_offered."
        routine: { type: boolean }
        title_id: { type: integer, format: int64, nullable: true }
        version_id: { type: integer, format: int64, nullable: true }
        episode_id: { type: integer, format: int64, nullable: true }
        grab_id: { type: integer, format: int64, nullable: true }
        request_id: { type: integer, format: int64, nullable: true }
        message: { type: string }
        data:
          type: object
          nullable: true
          additionalProperties: true
          description: The kind's payload, such as per-episode pack results.
    BlocklistList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BlocklistEntry"
    BlocklistEntry:
      type: object
      required: [id, release_name, indexer_id, reason, size, published_at, created_at, title_id, grab_id]
      properties:
        id: { type: integer, format: int64 }
        release_name: { type: string }
        indexer_id: { type: integer, format: int64 }
        reason: { type: string }
        size: { type: integer, format: int64 }
        published_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        title_id: { type: integer, format: int64, nullable: true }
        grab_id: { type: integer, format: int64, nullable: true }
    UpcomingList:
      type: object
      required: [from, to, items]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        items:
          type: array
          items:
            $ref: "#/components/schemas/UpcomingItem"
    UpcomingItem:
      type: object
      required: [date, kind, title_id, title, year, release_type, season, episode, episode_name, searchable_from, released]
      properties:
        date:
          type: string
          format: date
        kind:
          $ref: "#/components/schemas/TitleKind"
        title_id:
          type: integer
          format: int64
        title:
          type: string
        year:
          type: integer
          nullable: true
        release_type:
          type: string
          nullable: true
          enum: [theatrical, digital, physical]
          description: Which release a Movie's `date` is; null for an episode.
        season:
          type: integer
          nullable: true
        episode:
          type: integer
          nullable: true
        episode_name:
          type: string
          nullable: true
        searchable_from:
          type: string
          format: date
          nullable: true
          description: For a Movie, the day it becomes searchable in the release-date country; null for an episode or when unknown.
        released:
          type: boolean
          description: For a Movie, whether it is already searchable (false means "searchable from `searchable_from`"). Always true for an episode.
    RecentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RecentItem"
    RecentItem:
      type: object
      required: [title_id, title, year, kind, slot, release_name, score, score_delta, files, is_upgrade, imported_at]
      properties:
        title_id:
          type: integer
          format: int64
        title:
          type: string
        year:
          type: integer
          nullable: true
        kind:
          $ref: "#/components/schemas/TitleKind"
        slot:
          $ref: "#/components/schemas/Slot"
        release_name:
          type: string
        score:
          type: integer
          nullable: true
        score_delta:
          type: integer
          nullable: true
          description: What an Upgrade gained over the file it replaced; null for a first Import.
        files:
          type: integer
        is_upgrade:
          type: boolean
        imported_at:
          type: string
          format: date-time
    QueueList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/QueueItem"
    QueueItem:
      type: object
      required: [grab_id, title_id, version_id, title, year, slot, episodes, release_name, phase, bytes_total, bytes_left, eta, is_upgrade, score_delta]
      properties:
        grab_id:
          type: integer
          format: int64
        title_id:
          type: integer
          format: int64
          nullable: true
        version_id:
          type: integer
          format: int64
          nullable: true
        title:
          type: string
          description: The Title's name, empty when the Title was deleted.
        year:
          type: integer
          nullable: true
        slot:
          allOf:
            - $ref: "#/components/schemas/Slot"
          nullable: true
        episodes:
          type: array
          description: The episodes a Series Grab covers (`S01E02`); empty for a Movie.
          items:
            type: string
        release_name:
          type: string
        phase:
          type: string
          enum: [queued, downloading, paused, post_processing, importing]
        bytes_total:
          type: integer
          format: int64
        bytes_left:
          type: integer
          format: int64
        eta:
          type: integer
          nullable: true
          description: Seconds left, null when the client does not know.
        is_upgrade:
          type: boolean
        score_delta:
          type: integer
          nullable: true
          description: For an Upgrade, how many points the Release scores above the file it replaces.
    ReleaseDateEntry:
      type: object
      required: [country, type, date, certification]
      properties:
        country:
          type: string
        type:
          type: string
          enum: [premiere, theatrical_limited, theatrical, digital, physical, tv]
        date:
          type: string
          format: date-time
        certification:
          type: string
          nullable: true
    Rating:
      type: object
      required: [source, value, scale, votes, url]
      description: |
        One audience rating of a Title from a ratings source: the average of its users' votes. Today
        only TMDB's. Not a content rating (`certification`) and not a Release's `score`.
      properties:
        source:
          type: string
          description: "Where the rating is from: `tmdb`. Clients tolerate new values."
          example: tmdb
        value:
          type: number
          format: double
          nullable: true
          description: The rating on the source's scale; `null` when the source has none yet.
          example: 8.4
        scale:
          type: number
          format: double
          nullable: true
          description: The best rating on the source's scale, such as 10.
          example: 10
        votes:
          type: integer
          nullable: true
          description: How many votes the rating averages.
          example: 21000
        url:
          type: string
          nullable: true
          description: The Title's page at the source.
          example: https://www.themoviedb.org/movie/116149
    TitleDetail:
      type: object
      required: [id, kind, tmdb_id, tvdb_id, imdb_id, title, original_title, primary_title, year, original_language, overview, runtime, has_poster, monitored, metadata_frozen, root_folder, folder, added_at, refreshed_at, certification, release_dates, series_monitor, seasons, versions, requests, ratings]
      properties:
        id:
          type: integer
          format: int64
        requests:
          type: array
          description: The Requests that asked for this Title, oldest first.
          items:
            $ref: "#/components/schemas/RequestOrigin"
        kind:
          $ref: "#/components/schemas/TitleKind"
        tmdb_id:
          type: integer
          nullable: true
        tvdb_id:
          type: integer
          nullable: true
        imdb_id:
          type: string
          nullable: true
        title:
          type: string
        original_title:
          type: string
        primary_title:
          type: string
        year:
          type: integer
          nullable: true
        original_language:
          type: string
          description: ISO 639-1; empty when unknown.
        overview:
          type: string
        runtime:
          type: integer
          nullable: true
          description: Minutes.
        has_poster:
          type: boolean
          description: Whether `GET /titles/{id}/poster` has an image.
        monitored:
          type: boolean
        metadata_frozen:
          type: boolean
        root_folder:
          type: string
        folder:
          type: string
          nullable: true
          description: The Title's folder name; set by its first Import.
        added_at:
          type: string
          format: date-time
        refreshed_at:
          type: string
          format: date-time
        certification:
          type: string
          nullable: true
          description: The certification in the release-date country, else the US, else the earliest anywhere.
        release_dates:
          type: array
          description: Every dated release TMDB lists, in any country.
          items:
            $ref: "#/components/schemas/ReleaseDateEntry"
        series_monitor:
          allOf:
            - $ref: "#/components/schemas/SeriesMonitor"
          nullable: true
          description: "`null` for a Movie."
        seasons:
          type: array
          description: A Series' seasons in order, Specials (0) first; empty for a Movie.
          items:
            $ref: "#/components/schemas/Season"
        versions:
          type: array
          description: In Slot order.
          items:
            $ref: "#/components/schemas/VersionDetail"
        ratings:
          type: array
          description: Audience ratings of the Title from ratings sources; empty when none has one.
          items:
            $ref: "#/components/schemas/Rating"
    RequestTitle:
      type: object
      required: [kind]
      description: The Title asked for. Kestrel needs `tmdb_id`, or a `tvdb_id` of a Series already in the Library.
      properties:
        kind:
          $ref: "#/components/schemas/TitleKind"
        tmdb_id:
          type: integer
          nullable: true
        tvdb_id:
          type: integer
          nullable: true
        imdb_id:
          type: string
          nullable: true
    RequestSlotCreate:
      type: object
      required: [slot]
      properties:
        slot:
          $ref: "#/components/schemas/Slot"
        profile:
          type: string
          nullable: true
          description: A Profile key of that Slot; left out, Profile resolution picks one.
    Requester:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    RequestCreate:
      type: object
      required: [source, source_request_id, requester, title, slots]
      properties:
        source:
          type: string
          example: silo
        source_request_id:
          type: string
          description: The source's own id; the key that makes a retry idempotent.
        requester:
          $ref: "#/components/schemas/Requester"
        title:
          $ref: "#/components/schemas/RequestTitle"
        slots:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RequestSlotCreate"
        root_folder:
          type: string
          description: |
            One of the configured Root folders of the Title's kind; left out means the first one. It applies only to a Title the Request creates: a Request never moves a Title already in the library. Not one of that kind's Root folders is a `422` on `root_folder`.
        seasons:
          type: array
          nullable: true
          description: Series only; `null` or left out asks for the whole Series.
          items:
            type: integer
    RequestDownload:
      type: object
      required: [phase, bytes_total, bytes_left, eta]
      properties:
        phase:
          type: string
          description: "`queued`, `downloading`, `paused`, `post_processing` or `importing`."
        bytes_total:
          type: integer
          format: int64
          description: 0 when the download client does not know the size.
        bytes_left:
          type: integer
          format: int64
        eta:
          type: integer
          nullable: true
          description: Seconds.
    RequestSlot:
      type: object
      required: [slot, profile, version_id, status, status_label, download]
      properties:
        slot:
          $ref: "#/components/schemas/Slot"
        profile:
          type: string
          nullable: true
          description: The Version's Profile; `null` for a rejected Request that never resolved one.
        version_id:
          type: integer
          format: int64
          nullable: true
          description: "`null` when there is no Version: the Request was rejected, or the Version was removed since."
        status:
          type: string
          enum: [queued, downloading, completed, failed]
          description: |
            Derived on every read. `failed` only when Kestrel rejected the Request or the Version or Title
            was removed later; a failed download never shows as failed (it is blocklisted and retried).
        status_label:
          type: string
          description: "`Not released yet` or `Searching` while queued."
        download:
          allOf:
            - $ref: "#/components/schemas/RequestDownload"
          nullable: true
    Request:
      type: object
      required: [id, source, source_request_id, requester, outcome, reject_reason, title_id, seasons, created_at, slots]
      properties:
        id:
          type: integer
          format: int64
        source:
          type: string
        source_request_id:
          type: string
        requester:
          $ref: "#/components/schemas/Requester"
        outcome:
          type: string
          enum: [accepted, rejected]
        reject_reason:
          type: string
          nullable: true
          enum: [not_on_tvdb, unknown_title, no_enabled_profile]
        title_id:
          type: integer
          format: int64
          nullable: true
        seasons:
          type: array
          description: The seasons asked for; empty for a Movie or the whole Series.
          items:
            type: integer
        created_at:
          type: string
          format: date-time
        slots:
          type: array
          items:
            $ref: "#/components/schemas/RequestSlot"
    RequestList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Request"
        next_cursor:
          type: string
          nullable: true
    RequestOrigin:
      type: object
      required: [id, source, requester_name, created_at]
      description: Who asked for a Title and from where, for "Requested by Anna via Silo".
      properties:
        id:
          type: integer
          format: int64
        source:
          type: string
        requester_name:
          type: string
        created_at:
          type: string
          format: date-time
    CleanupCategoryKey:
      type: string
      enum: [junk, samples, orphaned_subtitles, empty_folders, other_language_subtitles, artwork, extras, unmanaged_videos]
    CleanupPreviewFile:
      type: object
      required: [path, size, title_id]
      properties:
        path:
          type: string
        size:
          type: integer
          format: int64
        title_id:
          type: integer
          format: int64
    CleanupPreviewCategory:
      type: object
      required: [key, default_ticked, count, size, files]
      properties:
        key:
          $ref: "#/components/schemas/CleanupCategoryKey"
        default_ticked:
          type: boolean
        count:
          type: integer
        size:
          type: integer
          format: int64
        files:
          type: array
          items:
            $ref: "#/components/schemas/CleanupPreviewFile"
    CleanupPreview:
      type: object
      required: [preview_id, categories]
      properties:
        preview_id:
          type: string
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CleanupPreviewCategory"
    CleanupResult:
      type: object
      required: [deleted, bytes, failed]
      properties:
        deleted:
          type: integer
        bytes:
          type: integer
          format: int64
        failed:
          type: integer
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: |
            Stable machine-readable code from a closed, growable list. Clients branch on this,
            never on the message text.
          example: internal
        errors:
          type: array
          description: Field-level problems for `validation` errors.
          items:
            type: object
            required: [field, code, message]
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
